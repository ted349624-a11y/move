<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#010207">
<meta name="description" content="Layer Run - steer the glowing core through an endless neon tunnel, dodge every barrier and climb the global leaderboard.">
<title>Layer Run</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="application-name" content="Layer Run">
<meta name="apple-mobile-web-app-title" content="Layer Run">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="modulepreload" href="/vendor/three-r160.min.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00e5ff;--magenta:#ff2bd6;--violet:#7a5cff;--crimson:#ff2d55;--amber:#ffb020;--lime:#3dff8a;
  --glass:rgba(6,10,24,.62);--line:rgba(255,255,255,.12);
  --text:#eaf2ff;--muted:#93a1c4;
  --display:'Unbounded',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#010207;color:var(--text);
  font-family:var(--body);touch-action:manipulation;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.35) 0%,rgba(255,60,120,.25) 40%,rgba(255,25,80,.6) 100%)}
#touch{position:fixed;inset:0;z-index:4;display:none;touch-action:none}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:6;pointer-events:none;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
.hud-left .label{font-size:10px;font-weight:600;letter-spacing:.3em;color:var(--muted)}
.hud-left .val{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.04em;margin-top:2px}
.hud-center{text-align:center}
#score{font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,58px);line-height:1;letter-spacing:.02em;
  text-shadow:0 0 6px rgba(255,255,255,.55),0 0 22px rgba(0,229,255,.55),0 2px 0 rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.speed{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--muted)}
.speed b{color:#fff;font-weight:700}
.hud-right{display:flex;justify-content:flex-end;gap:10px}
.icon-btn{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(0,229,255,.35);
  background:rgba(4,8,20,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 12px rgba(0,229,255,.15);
  display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .12s,box-shadow .2s}
.icon-btn:hover{background:rgba(10,30,52,.7);box-shadow:0 0 18px rgba(0,229,255,.35)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:#dff9ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#banner{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  font-family:var(--display);font-weight:600;font-size:clamp(15px,4.4vw,26px);letter-spacing:.14em;white-space:nowrap;
  opacity:0;text-shadow:0 0 6px rgba(255,255,255,.6),0 0 24px currentColor}
#banner.show{animation:banner 1.8s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.7);letter-spacing:.5em}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

#hint{position:fixed;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom));z-index:5;pointer-events:none;
  text-align:center;font-size:11px;font-weight:600;letter-spacing:.26em;color:rgba(234,242,255,.85);white-space:nowrap;
  animation:hint 4s ease forwards}
@keyframes hint{0%,70%{opacity:1}100%{opacity:0}}
#grip{position:fixed;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
  pointer-events:none;z-index:5;opacity:0;transform:translate3d(-200px,-200px,0);transition:opacity .25s ease;
  background:radial-gradient(circle,rgba(210,236,255,.42) 0%,rgba(140,200,255,.14) 38%,rgba(140,200,255,0) 70%);
  box-shadow:inset 0 0 0 1.5px rgba(210,236,255,.35),0 0 30px rgba(120,190,255,.25)}
#grip.on{opacity:1}

#pops{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.08em;white-space:nowrap;
  text-shadow:0 0 14px currentColor,0 0 2px #fff;animation:pop 1s ease-out forwards}
.pop.small{font-size:14px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  15%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--glass);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--line);border-radius:24px;padding:30px 26px;text-align:center;position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08)}
.panel::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--cyan),var(--violet),var(--magenta));opacity:.65;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.kicker{font-size:11px;font-weight:600;letter-spacing:.38em;color:var(--muted);margin-bottom:10px}
.kicker.red{color:#ff5a93;text-shadow:0 0 14px rgba(255,45,120,.6)}
h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.1em}

/* Main page: the name as a neon sign */
.menu{flex-direction:column;justify-content:space-between;text-align:center;background:
  linear-gradient(180deg,rgba(1,2,7,.6) 0%,rgba(1,2,7,0) 30%,rgba(1,2,7,0) 60%,rgba(1,2,7,.8) 100%)}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(38px,min(11.5vw,10vh),108px);letter-spacing:.06em;line-height:1;
  white-space:nowrap;padding-top:5vh;color:#fff;
  text-shadow:0 0 4px rgba(255,255,255,.9),0 0 14px rgba(0,229,255,.95),0 0 34px rgba(0,229,255,.7),0 0 70px rgba(122,92,255,.55),0 0 110px rgba(255,43,214,.45)}
.menu-bottom{width:min(360px,100%);display:flex;flex-direction:column;gap:16px;padding:0 6px 8px}

/* Buttons: clean pills - white primary, frosted-glass secondary */
.btn{position:relative;overflow:hidden;font-family:'Sora',var(--body);font-weight:600;letter-spacing:.12em;font-size:14px;color:#fff;
  padding:18px 24px;border-radius:999px;cursor:pointer;width:100%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .12s,box-shadow .25s,border-color .25s,background .25s,opacity .2s}
.btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{border:none;color:#07090f;background:#fff;box-shadow:0 10px 40px rgba(160,200,255,.35)}
.btn.primary:hover{background:#fff;box-shadow:0 12px 50px rgba(160,210,255,.5)}
.btn.primary::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(160,220,255,.7) 50%,transparent 65%);
  transform:translateX(-120%);animation:sheen 3.4s ease-in-out infinite}
.btn.primary:disabled::after{display:none}
@keyframes sheen{0%,62%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion: reduce){.btn.primary::after{animation:none;display:none}}
.row{display:flex;gap:12px;margin-top:14px}
.row .btn{padding:16px 8px;letter-spacing:.1em;font-size:11px;white-space:nowrap}

.final{font-family:var(--display);font-weight:700;font-size:clamp(46px,13vw,78px);line-height:1;margin:6px 0 10px;
  font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 6px rgba(255,255,255,.8),0 0 22px rgba(0,229,255,.75),0 0 54px rgba(122,92,255,.5)}
.sub{font-size:11px;font-weight:600;letter-spacing:.16em;line-height:2;color:var(--muted);margin-bottom:22px}
.sub b{color:#fff;font-weight:700}
.nw{white-space:nowrap;display:inline-block;margin:0 9px}
.new-best{display:inline-block;margin-right:8px;padding:3px 9px;border-radius:999px;color:#06101e;font-weight:700;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 18px rgba(0,229,255,.45)}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.38);
  font-size:17px;font-weight:500;letter-spacing:.04em;text-align:center;outline:none;user-select:text;-webkit-user-select:text;
  transition:border-color .2s,box-shadow .2s}
input:focus{border-color:rgba(0,229,255,.7);box-shadow:0 0 0 4px rgba(0,229,255,.14),0 0 18px rgba(0,229,255,.25)}
.status{min-height:22px;margin-top:10px;font-size:14px;font-weight:500;letter-spacing:.02em;color:var(--muted)}
.status.ok{color:var(--lime)}
.status.err{color:#ff6b86}

.board-panel{text-align:left;padding:24px 18px 18px;display:flex;flex-direction:column;max-height:min(720px,100%)}
.board-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px 16px}
.board-head .kicker{margin-bottom:6px}
.board-list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.entry{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);font-size:16px;font-weight:500}
.entry .rk{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);text-align:center}
.entry .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .sc{font-family:var(--display);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.entry.r1{background:linear-gradient(90deg,rgba(255,196,0,.18),rgba(255,196,0,.03));border-color:rgba(255,196,0,.3)}
.entry.r1 .rk{color:#ffd24a;text-shadow:0 0 12px rgba(255,200,0,.7)}
.entry.r2{background:linear-gradient(90deg,rgba(200,220,255,.14),rgba(200,220,255,.02));border-color:rgba(200,220,255,.25)}
.entry.r2 .rk{color:#dfe8ff}
.entry.r3{background:linear-gradient(90deg,rgba(255,140,80,.15),rgba(255,140,80,.02));border-color:rgba(255,140,80,.25)}
.entry.r3 .rk{color:#ffab7a}
.entry.me{box-shadow:inset 0 0 0 1px rgba(0,229,255,.65),0 0 22px rgba(0,229,255,.18)}
.entry.me .nm::after{content:'YOU';font-size:9px;font-weight:700;letter-spacing:.2em;margin-left:8px;padding:2px 6px;
  border-radius:6px;background:rgba(0,229,255,.2);color:var(--cyan);vertical-align:middle}
.board-foot{padding:14px 8px 2px;font-size:13px;font-weight:500;color:var(--muted);text-align:center;letter-spacing:.04em}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:15px}
.paused-panel{display:flex;flex-direction:column;gap:14px}

/* One-time X tasks: a deck where each new task lands on top of the finished one */
.tasks-panel{padding:28px 22px 22px}
.tasks-close{position:absolute;top:14px;right:14px}
.tprog{height:4px;border-radius:4px;background:rgba(255,255,255,.1);margin:18px 0 10px;overflow:hidden}
.tbar{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 12px rgba(0,229,255,.6);transition:width .5s ease}
.tstep{font-size:11px;font-weight:600;letter-spacing:.3em;color:var(--muted)}
.deck{display:grid;margin-top:18px;padding-bottom:42px}
.card{grid-area:1/1;align-self:start;position:relative;padding:22px 20px 20px;border-radius:20px;text-align:center;
  background:linear-gradient(180deg,#151b36,#0a0e20);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);transform-origin:50% 100%;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s ease,filter .55s ease}
.card.enter{transform:translateY(-40px) scale(1.05);opacity:0}
.card.past{pointer-events:none;overflow:hidden}
.card.past > *{visibility:hidden}
.card-ico{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;
  background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.35);box-shadow:0 0 18px rgba(0,229,255,.2)}
.card-ico svg,.card-check svg{width:24px;height:24px;fill:none;stroke:#bff6ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card-title{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.05em}
.card-text{margin:8px 0 16px;font-size:14px;line-height:1.55;color:#b9c4dd}
.card .btn + .btn{margin-top:10px}
.card a.btn{display:block;text-decoration:none;text-align:center}
.card-check{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;display:none;place-items:center;
  background:linear-gradient(135deg,var(--cyan),var(--lime));box-shadow:0 0 14px rgba(61,255,138,.5)}
.card-check svg{width:16px;height:16px;stroke:#04121a;stroke-width:3}
.card.past .card-check{display:grid}
.handle{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.38);padding:0 20px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.handle:focus-within{border-color:rgba(0,229,255,.7);box-shadow:0 0 0 4px rgba(0,229,255,.14)}
.handle span{color:var(--muted);font-weight:600;font-size:17px}
.handle input{border:none;background:transparent;padding:15px 0;text-align:left;box-shadow:none;border-radius:0}
.handle input:focus{box-shadow:none}
.card-err{min-height:18px;margin-top:8px;font-size:12px;color:#ff6b86}
.paused-panel h2{margin-bottom:8px}

#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:#010207;font-size:11px;font-weight:600;letter-spacing:.4em;color:var(--muted);transition:opacity .8s ease}
#loading.done{opacity:0;pointer-events:none}
.spinner{width:54px;height:54px;border-radius:50%;
  background:conic-gradient(var(--cyan),var(--violet),var(--magenta),var(--cyan));
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{max-width:320px;text-align:center;line-height:1.8;letter-spacing:.12em}
#loading .retry{font-family:'Sora',var(--body);font-weight:600;font-size:13px;letter-spacing:.12em;color:#07090f;background:#fff;
  border:none;border-radius:999px;padding:15px 34px;cursor:pointer;box-shadow:0 10px 40px rgba(160,200,255,.35)}
#loading .err{max-width:300px;font-size:10px;letter-spacing:.04em;color:#5d6a88;text-align:center;word-break:break-word}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="touch"></div>
<div id="grip"></div>
<div id="pops"></div>
<div id="banner"></div>

<div id="hud" class="hidden">
  <div class="hud-left"><div class="label">BEST</div><div class="val" id="hudBest">0</div></div>
  <div class="hud-center"><div id="score">0</div><div class="speed" id="speed"></div></div>
  <div class="hud-right">
    <button class="icon-btn" id="btnMute" aria-label="Toggle sound"></button>
    <button class="icon-btn" id="btnPause" aria-label="Pause">
      <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
    </button>
  </div>
</div>
<div id="hint" class="hidden">DRAG ANYWHERE TO STEER</div>

<section id="menu" class="screen menu hidden">
  <div class="menu-top">
    <h1 class="logo">LAYER RUN</h1>
  </div>
  <div class="menu-bottom">
    <button class="btn primary" id="btnPlay">PLAY</button>
    <button class="btn" id="btnBoard">LEADERBOARD</button>
  </div>
</section>

<section id="over" class="screen hidden">
  <div class="panel">
    <div class="kicker red">CORE LOST</div>
    <div class="final" id="finalScore">0</div>
    <div class="sub"><span class="new-best hidden" id="newBest">NEW BEST</span><span class="nw">BEST <b id="overBest">0</b></span><span class="nw">DISTANCE <b id="overDist">0</b> M</span><span class="nw">NEAR MISSES <b id="overNear">0</b></span></div>
    <form id="submitForm" autocomplete="off">
      <input id="name" maxlength="16" placeholder="Enter your name" spellcheck="false" autocapitalize="off" aria-label="Player name">
      <button class="btn primary" id="btnSubmit" type="submit">SUBMIT SCORE</button>
    </form>
    <div class="status" id="submitStatus"></div>
    <div class="row">
      <button class="btn" id="btnAgain">PLAY AGAIN</button>
      <button class="btn" id="btnBoard2">RANKINGS</button>
    </div>
  </div>
</section>

<section id="tasks" class="screen hidden">
  <div class="panel tasks-panel">
    <button class="icon-btn tasks-close" id="btnTasksClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="kicker">ONE-TIME ACCESS</div>
    <h2>UNLOCK THE GAME</h2>
    <div class="tprog"><div class="tbar" id="tasksBar"></div></div>
    <div class="tstep" id="tasksStep"></div>
    <div class="deck" id="deck"></div>
  </div>
</section>

<section id="board" class="screen hidden">
  <div class="panel board-panel">
    <div class="board-head">
      <div><div class="kicker">GLOBAL</div><h2>LEADERBOARD</h2></div>
      <button class="icon-btn" id="btnCloseBoard" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="board-list" id="boardList"></div>
    <div class="board-foot" id="boardFoot"></div>
  </div>
</section>

<section id="paused" class="screen hidden">
  <div class="panel paused-panel">
    <h2>PAUSED</h2>
    <button class="btn primary" id="btnResume">RESUME</button>
    <button class="btn" id="btnQuit">QUIT TO MENU</button>
  </div>
</section>

<div id="loading"><div class="spinner"></div><div id="loadingText">INITIALIZING</div></div>
<script>
// If the game has not started after a while, or fails to start, say so instead of spinning forever.
(function () {
  function fail(msg) {
    var l = document.getElementById('loading');
    if (!l || l.classList.contains('done') || window.__booted) return;
    l.innerHTML = '<p>' + msg + '</p><button class="retry" type="button">TRY AGAIN</button><small class="err"></small>';
    l.querySelector('.retry').addEventListener('click', function () { location.reload(); });
    return l.querySelector('.err');
  }
  window.__bootFail = function (err) {
    var e = fail('The game could not start on this device.');
    if (e) e.textContent = String(err && err.message || err || '').slice(0, 160);
  };
  window.__bootTimer = setTimeout(function () { fail('Loading is taking longer than usual. Check your connection and try again.'); }, 15000);
  window.addEventListener('error', function (ev) { if (!window.__booted) window.__bootFail(ev.message || 'Script error'); });
})();
</script>

<script type="module">
import * as THREE from '/vendor/three-r160.min.js';
import { EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass } from '/vendor/three-r160.min.js';

/* =========================================================
   Utilities & constants
   ========================================================= */
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },

uniform float uTrack, uTime, uPulse, uFogD;
uniform vec3 uColA, uColB, uPlayer, uCam, uFog;
varying vec3 vW;

void main(){

  float T = uTrack - vW.z;                       // position along the track, in metres
  float fd = length(uCam - vW);
  float nearFade = smoothstep(1.5, 14.0, fd);    // keep lights that brush past the lens from flooding the screen
  // dark armour panels
  float pz = fract(T / 4.0), pa = fract(u * 28.0);
  float seam = smoothstep(0.0, 0.025, pz) * smoothstep(1.0, 0.975, pz) * smoothstep(0.0, 0.035, pa) * smoothstep(1.0, 0.965, pa);

const MAXP = isTouch ? 3000 : 5000;

const pMat = new THREE.ShaderMaterial({

    void main(){
      vC = pcolor; vA = palpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = psize * uPR * (300.0 / max(-mv.z, 0.5));

function emit(x, y, z, vx, vy, vz, c, size, life, drag) {
  const i = pHead;
  pHead = (pHead + 1) % MAXP;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
  pSize0[i] = size; pSize[i] = size; pLife[i] = life; pMax[i] = life; pDrag[i] = drag; pAlpha[i] = 1;
}
function burst(pos, color, n, speed, size, life, forward = 0) {
  for (let i = 0; i < n; i++) {
    const a = rand() * Math.PI * 2, z = rand() * 2 - 1, rr = Math.sqrt(1 - z * z);
    const s = speed * (0.25 + rand() * 0.95);
    const c = rand() < 0.22 ? WHITE : color;
    emit(pos.x, pos.y, pos.z, Math.cos(a) * rr * s, Math.sin(a) * rr * s, z * s * 0.6 + forward * rand(), c, size * (0.4 + rand()), life * (0.45 + rand() * 0.8), 2.2);

function updateParticles(dt) {

    pLife[i] -= dt;

    const k = pLife[i] / pMax[i], damp = Math.exp(-pDrag[i] * dt), j = i * 3;
    pVel[j] *= damp; pVel[j + 1] *= damp; pVel[j + 2] *= damp;
    pPos[j] += pVel[j] * dt; pPos[j + 1] += pVel[j + 1] * dt; pPos[j + 2] += pVel[j + 2] * dt;
    pAlpha[i] = k * k;
    pSize[i] = pSize0[i] * (0.35 + 0.65 * k);
  }

  pGeo.attributes.psize.needsUpdate = true;
  pGeo.attributes.palpha.needsUpdate = true;
  pGeo.attributes.pcolor.needsUpdate = true;

}
function updateWaves(dt) {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.t += dt;
    const k = Math.min(1, w.t / w.life), e = 1 - Math.pow(1 - k, 3);

/* =========================================================
   Obstacles. Each barrier's shape is a signed distance field:
   the same function draws it (GLSL) and decides collisions (JS).
   ========================================================= */
const BARRIER_FS = `
uniform int uKind; uniform vec3 uSlab; uniform vec3 uHole; uniform vec4 uBeams[3]; uniform int uBeamCount;
uniform vec3 uCol; uniform float uTime, uFogD, uFlash, uAppear;
varying vec2 vP; varying float vDepth;
float sdf(vec2 p){
  if (uKind == 0) return uSlab.z - dot(p, uSlab.xy);
  if (uKind == 1) return uHole.z - length(p - uHole.xy);
  float m = 1e3;
  for (int i = 0; i < 3; i++) { if (i >= uBeamCount) break; vec4 b = uBeams[i]; m = min(m, abs(dot(p, b.xy) - b.z) - b.w); }
  return m;
}
float lattice(vec2 p){
  float l = 0.0;
  for (int i = 0; i < 3; i++) { float a = float(i) * 1.0471976; vec2 d = vec2(cos(a), sin(a)); float v = abs(fract(dot(p, d)) - 0.5); l = max(l, smoothstep(0.44, 0.5, v)); }
  return l;
}
void main(){
  float s = sdf(vP);
  if (s > 0.8) discard;
  float inside = 1.0 - smoothstep(-0.02, 0.02, s);
  float lat = lattice(vP * 1.4);
  float scan = 0.5 + 0.5 * sin(vP.y * 9.0 - uTime * 6.0);
  float rim = exp(-abs(s) * 16.0);
  float halo = (1.0 - inside) * exp(-max(s, 0.0) * 6.0);
  float wall = exp(-(6.0 - length(vP)) * 6.0) * inside;
  vec3 col = uCol * (0.08 + 0.5 * lat + 0.07 * scan) * inside + uCol * (rim * 3.2 + halo * 0.8 + wall * 1.4) + vec3(1.0) * rim * rim * 1.1;
  float a = inside * (0.6 + 0.25 * lat) + rim * 0.9 + halo * 0.45;
  if (uKind == 2) { col += (vec3(1.2) + uCol * 1.6) * inside; a = max(a, inside); }
  col *= 1.0 + uFlash * 2.0;
  float fog = exp(-vDepth * uFogD) * uAppear;
  gl_FragColor = vec4(col * fog, clamp(a, 0.0, 1.0) * fog);
}`;
const BARRIER_VS = 'varying vec2 vP; varying float vDepth; void main(){ vP = position.xy; vec4 mv = modelViewMatrix * vec4(position, 1.0); vDepth = -mv.z; gl_Position = projectionMatrix * mv; }';
function barrierMaterial(kind, col) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uKind: { value: kind }, uSlab: { value: new THREE.Vector3() }, uHole: { value: new THREE.Vector3() },
      uBeams: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] }, uBeamCount: { value: 0 },
      uCol: { value: col.clone() }, uTime: { value: 0 }, uFogD: { value: FOG_D }, uFlash: { value: 0 }, uAppear: { value: 0 },
    },
    vertexShader: BARRIER_VS, fragmentShader: BARRIER_FS,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
}
const discGeo = new THREE.CircleGeometry(TR - 0.03, 128);
const gateRingGeo = new THREE.TorusGeometry(TR - 0.06, 0.07, 10, 180);
const emitterGeo = new THREE.SphereGeometry(0.22, 16, 12);
const obstacles = [];

function sdfLocal(ob, x, y) {
  if (ob.kind === 'slab') return ob.d - (x * ob.nx + y * ob.ny);
  if (ob.kind === 'hole') return ob.hr - Math.hypot(x - ob.hx, y - ob.hy);
  if (ob.kind === 'blocks') {
    let m = 1e9;
    for (const k of ob.boxes) {
      const dx = Math.abs(x - k.x) - k.hx, dy = Math.abs(y - k.y) - k.hy;
      m = Math.min(m, Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0));
    }
    return m;
  }
  let m = 1e9;
  for (const b of ob.beams) m = Math.min(m, Math.abs(x * b.nx + y * b.ny - b.d) - b.w);
  return m;
}
function sdfWorld(ob, x, y, angle = ob.angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return sdfLocal(ob, x * c + y * s, -x * s + y * c);
}
// The roomiest spot in a barrier (used by the autopilot, the pickup trails and the fairness check).
function safest(ob, angle = ob.angle) {
  let best = { x: 0, y: 0, s: sdfWorld(ob, 0, 0, angle) };
  for (let ri = 1; ri <= 4; ri++) {
    const r = ri * 1.2;
    for (let j = 0; j < 16; j++) {
      const a = (j / 16) * Math.PI * 2, x = Math.cos(a) * r, y = Math.sin(a) * r;
      const v = sdfWorld(ob, x, y, angle);
      if (v > best.s) best = { x, y, s: v };
    }
  }
  return best;
}

function genObstacle(kind, k) {
  const ob = { kind, angle: 0, spin: 0, a0: 0 };
  if (kind === 'slab') {
    const a = rand() * Math.PI * 2;
    ob.nx = Math.cos(a); ob.ny = Math.sin(a); ob.d = 1.2 - rand() * (1.6 + 2.0 * k);
  } else if (kind === 'hole') {
    ob.hr = 2.4 - 0.95 * k + rand() * 0.3;
    const r = rand() * (TR - ob.hr - 0.4), a = rand() * Math.PI * 2;
    ob.hx = Math.cos(a) * r; ob.hy = Math.sin(a) * r;
  } else if (kind === 'beams') {
    const n = 1 + (rand() < 0.35 + 0.4 * k ? 1 : 0) + (k > 0.5 && rand() < 0.35 ? 1 : 0);
    ob.beams = [];
    for (let i = 0; i < n; i++) { const a = rand() * Math.PI; ob.beams.push({ nx: Math.cos(a), ny: Math.sin(a), d: (rand() * 2 - 1) * 3, w: 0.24 }); }

}

function spawnObstacle(z, dist) {
  const k = clamp(dist / 4000, 0, 1);
  const kinds = ['slab', 'beams'];
  if (dist >= 300) kinds.push('hole');
  if (dist >= 800) kinds.push('blocks');
  if (dist >= 1400) kinds.push('spinner');
  let kind = kinds[(rand() * kinds.length) | 0];
  if (kind === S.lastKind && rand() < 0.65) kind = kinds[(rand() * kinds.length) | 0];
  S.lastKind = kind;
  // Every barrier must leave room for the core.
  let ob = null;
  for (let tries = 0; tries < 6 && !ob; tries++) {
    const cand = genObstacle(kind, k);
    if (kind === 'spinner' || safest(cand).s >= PLAYER_R + 0.35) ob = cand;
  }
  if (!ob) ob = { kind: 'slab', nx: 1, ny: 0, d: 1.0, angle: 0, spin: 0, a0: 0 };

  const col = (rand() < 0.5 ? S.palTo.a : S.palTo.b).clone();
  const g = new THREE.Group();
  g.position.z = z;
  scene.add(g);
  Object.assign(ob, { z, g, col, crossed: false, flash: 0, age: 0, mats: [], geos: [], mat: null });
  const ringMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(1.5) });
  const hotMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(2.8) });
  ob.mats.push(ringMat, hotMat);
  g.add(new THREE.Mesh(gateRingGeo, ringMat));

  if (ob.kind === 'blocks') {
    const bm = new THREE.MeshPhysicalMaterial({ color: 0x0a0d15, metalness: 0.85, roughness: 0.26, clearcoat: 0.6, emissive: col, emissiveIntensity: 0.14, envMapIntensity: 0.9 });
    const em = new THREE.LineBasicMaterial({ color: col.clone().multiplyScalar(2.8) });
    ob.mats.push(bm, em);
    for (const b of ob.boxes) {
      const bg = new THREE.BoxGeometry(b.hx * 2, b.hy * 2, 1.4), eg = new THREE.EdgesGeometry(bg);
      ob.geos.push(bg, eg);
      const m = new THREE.Mesh(bg, bm);
      m.position.set(b.x, b.y, 0);
      const e = new THREE.LineSegments(eg, em);
      e.position.copy(m.position);
      g.add(m, e);
    }
  } else {
    const code = ob.kind === 'slab' ? 0 : ob.kind === 'hole' ? 1 : 2;
    const mat = barrierMaterial(code, col);
    ob.mat = mat;
    ob.mats.push(mat);
    if (code === 0) mat.uniforms.uSlab.value.set(ob.nx, ob.ny, ob.d);
    if (code === 1) {
      mat.uniforms.uHole.value.set(ob.hx, ob.hy, ob.hr);
      const tg = new THREE.TorusGeometry(ob.hr, 0.07, 10, 120);
      ob.geos.push(tg);
      const tm = new THREE.Mesh(tg, hotMat);
      tm.position.set(ob.hx, ob.hy, 0);
      g.add(tm);
    }
    if (code === 2) {
      mat.uniforms.uBeamCount.value = ob.beams.length;
      ob.beams.forEach((b, i) => {
        mat.uniforms.uBeams.value[i].set(b.nx, b.ny, b.d, b.w);
        const t = Math.sqrt(Math.max(0, TR * TR - b.d * b.d)) - 0.15;
        for (const sg of [-1, 1]) {
          const e = new THREE.Mesh(emitterGeo, hotMat);
          e.position.set(b.nx * b.d - b.ny * t * sg, b.ny * b.d + b.nx * t * sg, 0);
          g.add(e);
        }

    }
    const disc = new THREE.Mesh(discGeo, mat);
    disc.renderOrder = 1;
    g.add(disc);
  }
  g.rotation.z = ob.angle;
  obstacles.push(ob);
  spawnPickupTrail(ob);
}

function removeObstacle(i) {

}

   Post-processing: bloom + lens (chromatic aberration, grain, vignette)
   ========================================================= */
const composer = new EffectComposer(renderer);

const lensPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uShock: { value: 0 }, uSpeed: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uShock; uniform float uSpeed; varying vec2 vUv;
    float rnd(vec2 co){ return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float d = length(c);

      vec3 col;

      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;

const audio = { ctx: null, master: null, rev: null, noise: null, engine: null };

function initAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.6;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;

    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (rand() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    conv.buffer = ir;
    const rev = ctx.createGain();
    rev.gain.value = 0.28;
    rev.connect(conv); conv.connect(master);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = nb.getChannelData(0);

  g.gain.setValueAtTime(0.0001, t);

const SCALE = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
const sfx = {
  pass() { noise(0.2, 'bandpass', 500, 1.1, 0.05, 2200, 0.1); },

  pickup(n) { const f = 523 * Math.pow(2, SCALE[(n - 1) % SCALE.length] / 12); tone(f, 0.45, 'sine', 0.16, 0.6); tone(f * 2, 0.22, 'triangle', 0.04, 0.5); },
  crash() { tone(170, 1.2, 'sawtooth', 0.24, 0.4, 0.12); tone(60, 1.6, 'sine', 0.5, 0.3, 0.4); noise(1.4, 'lowpass', 2400, 0.7, 0.6, 80, 0.6); },
  start() { [0, 7, 12, 19].forEach((n, i) => setTimeout(() => tone(262 * Math.pow(2, n / 12), 0.5, 'triangle', 0.1, 0.7), i * 75)); },
  zone() { [12, 16, 19, 24, 28].forEach((n, i) => setTimeout(() => tone(262 * Math.pow(2, n / 12), 0.4, 'sine', 0.08, 0.7), i * 60)); },

  if (S.submitted || S.score < 1) return;
  const name = $('name').value.trim().replace(/\s+/g, ' ');
  if (!/^[A-Za-z0-9 _.\-]{2,16}$/.test(name)) { setStatus('Use 2-16 letters, numbers, spaces or _ - .', 'err'); return; }
  store.set('ntr_name', name);
  const btn = $('btnSubmit');
  btn.disabled = true;
  setStatus('Submitting...', '');
  try {
    const r = await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, score: S.score, token: S.token }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Submission failed.');
    S.submitted = true;
    btn.textContent = 'SUBMITTED';
    const extra = d.best > S.score ? ` · Your best: ${d.best.toLocaleString('en-US')}` : '';
    setStatus(`You are #${d.rank} of ${d.total} players${extra}`, 'ok');
    sfx.zone();
  } catch (err) {
    setStatus(err.message || 'Network error. Try again.', 'err');
    btn.disabled = false;
  }
}

async function openBoard(from) {
  boardReturn = from;
  show('board');
  const list = $('boardList'), foot = $('boardFoot');
  list.innerHTML = '<div class="empty">Loading rankings...</div>';
  foot.textContent = '';
  try {
    const r = await fetch('/api/leaderboard', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    const d = await r.json();
    list.innerHTML = '';
    if (!d.entries.length) { list.innerHTML = '<div class="empty">No runs yet. Be the first legend.</div>'; return; }
    const me = (store.get('ntr_name') || '').toLowerCase();
    let prevScore = null, rank = 0;
    d.entries.forEach((e, i) => {
      if (e.score !== prevScore) { rank = i + 1; prevScore = e.score; }
      const row = document.createElement('div');
      row.className = 'entry' + (rank <= 3 ? ' r' + rank : '') + (me && e.name.toLowerCase() === me ? ' me' : '');
      const rk = document.createElement('div'); rk.className = 'rk'; rk.textContent = rank;
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = e.name;
      const sc = document.createElement('div'); sc.className = 'sc'; sc.textContent = e.score.toLocaleString('en-US');
      row.append(rk, nm, sc);
      list.appendChild(row);
    });
    foot.textContent = `${d.total.toLocaleString('en-US')} players ranked`;
  } catch {
    list.innerHTML = '<div class="empty">The leaderboard is unavailable right now.</div>';
  }
}
function closeBoard() { show(boardReturn); }

/* =========================================================
   One-time X tasks before the first run
   ========================================================= */
const X_HANDLE = 'LayerRun';
// Paste the post's ID here (the number at the end of x.com/LayerRun/status/...).
// Until it is set, the like, repost and reply steps open the @LayerRun profile.
const X_POST_ID = '';
const X_PROFILE_URL = `https://x.com/${X_HANDLE}`;
const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICONS = {
  at: svg('<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>'),
  heart: svg('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>'),
  repost: svg('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'),
  reply: svg('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>'),
  bell: svg('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  check: svg('<path d="M20 6L9 17l-5-5"/>'),
  play: svg('<path d="M7 4l13 8-13 8z"/>'),
};
const TASKS = [
  { id: 'user', icon: ICONS.at, title: 'Your X username', text: 'Enter the X account you will use for the next steps.' },
  { id: 'like', icon: ICONS.heart, title: 'Like the post',
    text: X_POST_ID ? 'Open the post on X and tap the heart.' : `Open @${X_HANDLE} on X and like the pinned post.`,
    url: X_POST_ID ? `https://x.com/intent/like?tweet_id=${X_POST_ID}` : X_PROFILE_URL },
  { id: 'repost', icon: ICONS.repost, title: 'Repost it',
    text: 'Repost the same post so your followers see it.',
    url: X_POST_ID ? `https://x.com/intent/retweet?tweet_id=${X_POST_ID}` : X_PROFILE_URL },
  { id: 'reply', icon: ICONS.reply, title: 'Leave a reply',
    text: 'Reply to the post. Write whatever you like, in your own words.',
    url: X_POST_ID ? `https://x.com/intent/tweet?in_reply_to=${X_POST_ID}` : X_PROFILE_URL },
  { id: 'notify', icon: ICONS.bell, title: 'Turn on notifications',
    text: `Follow @${X_HANDLE}, then tap the bell on the profile so you never miss an update.`,
    url: X_PROFILE_URL },
];
const XT_KEY = 'lr_xtasks';
const XT = (() => { try { return JSON.parse(store.get(XT_KEY)) || {}; } catch { return {}; } })();
XT.step = Math.min(Number(XT.step) || 0, TASKS.length);
XT.user = typeof XT.user === 'string' ? XT.user : '';
const xDone = () => XT.step >= TASKS.length;
const saveXT = () => store.set(XT_KEY, JSON.stringify(XT));

function cleanHandle(v) {
  // accepts "name", "@name" or a pasted profile link; anything else is rejected, never trimmed down
  return String(v || '').trim().replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i, '').replace(/^@/, '').replace(/[/?#].*$/, '');
}
function recordX() {
  if (!xDone() || XT.recorded) return;
  fetch('/api/xtasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: XT.user }) })
    .then((r) => { if (r.ok) { XT.recorded = true; saveXT(); } })
    .catch(() => {});
}
function addText(el, cls, text, tag = 'div') {
  const n = document.createElement(tag);
  n.className = cls;
  n.textContent = text;
  el.appendChild(n);
  return n;
}
function buildCard(i) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-check">${ICONS.check}</div>`;
  if (i >= TASKS.length) {
    card.insertAdjacentHTML('beforeend', `<div class="card-ico">${ICONS.play}</div>`);
    addText(card, 'card-title', "YOU'RE IN");
    addText(card, 'card-text', `Thanks, @${XT.user}. The tunnel is open.`, 'p');
    const go = addText(card, 'btn primary', 'PLAY NOW', 'button');
    go.type = 'button';
    go.addEventListener('click', () => { initAudio(); sfx.click(); startGame(); });
    return card;
  }
  const t = TASKS[i];
  card.insertAdjacentHTML('beforeend', `<div class="card-ico">${t.icon}</div>`);
  addText(card, 'card-title', t.title);
  addText(card, 'card-text', t.text, 'p');
  if (t.id === 'user') {
    const form = document.createElement('form');
    form.autocomplete = 'off';
    form.innerHTML = '<label class="handle"><span>@</span><input maxlength="40" placeholder="username" spellcheck="false" autocapitalize="off" aria-label="X username"></label><button class="btn primary" type="submit">CONTINUE</button>';
    const input = form.querySelector('input');
    input.value = XT.user;
    const err = addText(card, 'card-err', '');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const h = cleanHandle(input.value);
      if (!/^[A-Za-z0-9_]{1,15}$/.test(h)) { err.textContent = 'Use your X handle: letters, numbers and _ (up to 15).'; return; }
      XT.user = h;
      input.blur();
      completeStep();
    });
    card.insertBefore(form, err);
  } else {
    const open = addText(card, 'btn primary', 'OPEN ON X', 'a');
    open.href = t.url;
    open.target = '_blank';
    open.rel = 'noopener noreferrer';
    const done = addText(card, 'btn', "I'VE DONE IT", 'button');
    done.type = 'button';
    done.disabled = true;
    open.addEventListener('click', () => { setTimeout(() => { done.disabled = false; }, 1500); });
    done.addEventListener('click', () => { sfx.click(); completeStep(); });
  }
  return card;
}
function layoutDeck(animateTop) {
  const cards = [...$('deck').children], top = cards.length - 1;
  if (top >= 0) cards[top].style.height = '';
  const h = top >= 0 ? cards[top].offsetHeight : 0;   // finished cards shrink to the top card's size, so only their edges show
  cards.forEach((c, i) => {
    const d = top - i;
    c.style.height = d ? h + 'px' : '';
    c.classList.toggle('past', d > 0);
    c.style.zIndex = String(20 - d);
    c.style.transform = d ? `translateY(${d * 13}px) scale(${1 - d * 0.05})` : '';
    c.style.opacity = d > 3 ? '0' : '';
    c.style.filter = d ? 'brightness(.5)' : '';
  });
  if (animateTop && cards[top]) {
    const c = cards[top];
    c.classList.add('enter');
    requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('enter')));
  }
  const n = Math.min(XT.step, TASKS.length);
  $('tasksBar').style.width = (n / TASKS.length) * 100 + '%';
  $('tasksStep').textContent = xDone() ? 'ALL STEPS DONE' : `STEP ${n + 1} OF ${TASKS.length}`;
}
function openTasks() {
  const deck = $('deck');
  deck.innerHTML = '';
  for (let i = 0; i <= XT.step; i++) deck.appendChild(buildCard(i));
  show('tasks');
  layoutDeck(true);
}
function completeStep() {
  XT.step = Math.min(XT.step + 1, TASKS.length);
  saveXT();
  $('deck').appendChild(buildCard(XT.step));
  layoutDeck(true);
  vibrate(12);
  if (audio.ctx) sfx.pickup(XT.step + 2);
  if (xDone()) recordX();
}
function requestPlay() {
  if (xDone()) startGame();
  else openTasks();
}
recordX();

/* =========================================================
   Input: drag anywhere to steer (touch or mouse), keys on desktop
   ========================================================= */
const drag = { active: false, id: null, lx: 0, ly: 0 };
const touchLayer = $('touch'), grip = $('grip');
const dragSens = () => 10.5 / (0.62 * Math.min(innerWidth, innerHeight));
function moveGrip(x, y) { grip.style.transform = `translate3d(${x}px, ${y}px, 0)`; }

touchLayer.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (S.state !== 'playing' || S.paused || drag.active) return;
  Object.assign(drag, { active: true, id: e.pointerId, lx: e.clientX, ly: e.clientY });
  try { touchLayer.setPointerCapture(e.pointerId); } catch {}
  moveGrip(e.clientX, e.clientY);
  grip.classList.add('on');
});
touchLayer.addEventListener('pointermove', (e) => {
  if (!drag.active || e.pointerId !== drag.id) return;
  e.preventDefault();
  const k = dragSens();
  ctrl.tx += (e.clientX - drag.lx) * k;
  ctrl.ty -= (e.clientY - drag.ly) * k;
  clampTarget();
  drag.lx = e.clientX; drag.ly = e.clientY;
  moveGrip(e.clientX, e.clientY);
});
function endDrag(e) {
  if (!drag.active || (e && e.pointerId !== drag.id)) return;
  drag.active = false;
  try { touchLayer.releasePointerCapture(drag.id); } catch {}
  drag.id = null;
  grip.classList.remove('on');
}
touchLayer.addEventListener('pointerup', endDrag);
touchLayer.addEventListener('pointercancel', endDrag);
touchLayer.addEventListener('lostpointercapture', endDrag);

const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (KEYMAP[k]) { keys[KEYMAP[k]] = true; if (S.state === 'playing') e.preventDefault(); return; }
  if (S.state === 'playing') {
    if (k === 'Escape' || k === 'p' || k === 'P') setPaused(!S.paused);
    else if (S.paused && (k === ' ' || k === 'Enter')) setPaused(false);
  } else if ((k === ' ' || k === 'Enter') && (S.state === 'menu' || S.state === 'over') && $('board').classList.contains('hidden') && $('tasks').classList.contains('hidden')) {
    e.preventDefault();
    requestPlay();
  } else if (k === 'Escape' && !$('board').classList.contains('hidden')) closeBoard();
  else if (k === 'Escape' && !$('tasks').classList.contains('hidden')) show('menu');
});
addEventListener('keyup', (e) => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.up = keys.down = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

const click = (id, fn) => $(id).addEventListener('click', (e) => { initAudio(); sfx.click(); fn(e); });
click('btnPlay', requestPlay);
click('btnAgain', requestPlay);
click('btnTasksClose', () => show('menu'));
click('btnBoard', () => openBoard('menu'));
click('btnBoard2', () => openBoard('over'));
click('btnCloseBoard', closeBoard);
click('btnResume', () => setPaused(false));
click('btnQuit', goMenu);
click('btnPause', () => setPaused(true));
$('btnMute').addEventListener('click', () => { initAudio(); toggleMute(); });
$('submitForm').addEventListener('submit', submitScore);

if (!isTouch) {
  $('hint').textContent = 'ARROWS / WASD  ·  OR DRAG WITH THE MOUSE';
}

/* =========================================================
   Main loop
   ========================================================= */
const clock = new THREE.Clock();

function update(dt, t) {
  const live = !(S.state === 'playing' && S.paused);
  const gdt = live ? dt * S.timeScale : 0;
  const playing = S.state === 'playing';
  const demo = S.state === 'menu' || S.state === 'over';

  // Speed
  if (S.state === 'dying') {
    S.dyingT += dt;
    S.timeScale = Math.min(1, S.timeScale + dt * 0.45);
    S.speed *= Math.exp(-gdt * 1.6);
    if (S.dyingT > 1.6) showOver();
  } else if (playing) {
    S.speed = 24 + 38 * (1 - Math.exp(-S.dist / 3000));
  } else {
    S.speed += (26 - S.speed) * (1 - Math.exp(-dt * 1.5));
  }

  S.gameTime += gdt;
  const move = S.speed * gdt;
  S.track += move;
  if (playing && live) {
    S.dist += move;
    S.score = Math.floor(S.dist) + S.bonus;
    const zi = Math.floor(S.dist / ZONE_LEN);
    if (zi !== S.zoneIdx) { S.zoneIdx = zi; setZone(zi % ZONES.length, true); }
  }

  // New barriers far down the tunnel
  if ((playing && live) || demo) {
    const dd = playing ? S.dist : 700;
    while (S.track + SPAWN_AHEAD >= S.nextGate) {
      spawnObstacle(-(S.nextGate - S.track), dd);
      S.nextGate += gapFor(dd);
    }
  }

  // Steering
  if (playing && live) {
    const kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), ky = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
    if (kx || ky) { ctrl.tx += kx * 9.5 * dt; ctrl.ty += ky * 9.5 * dt; clampTarget(); }
  } else if (demo) {
    // Attract mode: the core flies itself.
    let next = null;
    for (const ob of obstacles) if (!ob.crossed && (!next || ob.z > next.z)) next = ob;
    if (next) {
      const tc = S.gameTime + Math.max(0, -next.z) / Math.max(1, S.speed);
      const b = safest(next, next.a0 + next.spin * tc);
      ctrl.tx = b.x; ctrl.ty = b.y;
    }
  }
  const px = P.x, py = P.y, rate = playing ? 16 : 4;
  if (gdt > 0) {
    const f = 1 - Math.exp(-gdt * rate);
    P.x += (ctrl.tx - P.x) * f;
    P.y += (ctrl.ty - P.y) * f;
    P.vx = (P.x - px) / gdt;
    P.vy = (P.y - py) / gdt;
  }

  // Barriers
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    ob.z += move;
    ob.g.position.z = ob.z;
    if (ob.spin) { ob.angle = ob.a0 + ob.spin * S.gameTime; ob.g.rotation.z = ob.angle; }
    ob.flash *= Math.exp(-dt * 4);
    ob.age += dt;
    if (ob.mat) { ob.mat.uniforms.uTime.value = t; ob.mat.uniforms.uFlash.value = ob.flash; ob.mat.uniforms.uAppear.value = Math.min(1, ob.age / 0.5); }
    if (!ob.crossed && ob.z >= 0) { ob.crossed = true; onCross(ob); }
    if (ob.z > 16) removeObstacle(i);
  }

  // Pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    pk.z += move;
    pk.g.position.z = pk.z;
    pk.g.rotation.y += dt * 3;
    if (player.visible && Math.abs(pk.z) < 1.1 && Math.hypot(pk.x - P.x, pk.y - P.y) < 1.0) collect(i);
    else if (pk.z > 4) { removePickup(i); if (playing) S.pkStreak = 0; }
  }

  // Effects
  if (player.visible && gdt > 0) {
    for (let n = 0; n < 2; n++) {
      emit(P.x + (rand() - 0.5) * 0.25, P.y + (rand() - 0.5) * 0.25, 0.2,
        (rand() - 0.5) * 0.8, (rand() - 0.5) * 0.8, S.speed * 0.85 + rand() * 3,
        rand() < 0.5 ? WHITE : S.colA, 0.32 + rand() * 0.22, 0.32 + rand() * 0.2, 1.5);
    }
  }
  updateParticles(gdt);
  updateWaves(gdt);
  updateStreaks(gdt, S.speed, S.colA);

  // Palette transitions between zones
  if (S.palT < 1) {
    S.palT = Math.min(1, S.palT + dt / 1.5);
    const e = S.palT * S.palT * (3 - 2 * S.palT);
    S.colA.copy(S.palFrom.a).lerp(S.palTo.a, e);
    S.colB.copy(S.palFrom.b).lerp(S.palTo.b, e);
  } else if (!S.envDone) {
    S.envDone = true;
    makeEnv(S.palTo.a, S.palTo.b);
  }

  // The core
  player.position.set(P.x, P.y, 0);
  player.rotation.z = clamp(-P.vx * 0.035, -0.6, 0.6);
  player.rotation.x = clamp(P.vy * 0.025, -0.4, 0.4);
  gyroA.rotation.x += dt * 2.4; gyroA.rotation.y += dt * 1.3;
  gyroB.rotation.y -= dt * 1.9; gyroB.rotation.z += dt * 0.7; gyroB.rotation.x = 1.1;
  coreRing.rotation.x = Math.sin(t * 1.3) * 0.25;
  const beat = 0.5 + 0.5 * Math.sin(t * 6);
  coreOrbMat.color.copy(CORE_COL).multiplyScalar(1.5 + beat * 0.3);
  coreGlow.scale.setScalar(2.7 + beat * 0.25);
  playerLight.intensity = 26 + beat * 6;

  // Tunnel
  S.pulse *= Math.exp(-dt * 2.5);
  const tu = tunnelMat.uniforms;
  tu.uTrack.value = S.track;
  tu.uTime.value = t;
  tu.uPulse.value = S.pulse;
  tu.uColA.value.copy(S.colA);
  tu.uColB.value.copy(S.colB);
  tu.uPlayer.value.set(P.x, P.y, 0);
  endGlowMat.color.copy(S.colA);

  // Camera: follows the core, leans into turns, widens with speed
  S.shake *= Math.exp(-dt * 5);
  S.shock *= Math.exp(-dt * 2.2);
  const follow = camera.aspect < 1 ? 0.62 : 0.45;
  const sx = (rand() - 0.5) * S.shake, sy = (rand() - 0.5) * S.shake;
  camera.position.set(P.x * follow + sx, P.y * follow + 1.0 + sy, 7.2);
  camera.lookAt(P.x * follow * 0.5, P.y * follow * 0.5 + 0.2, -40);
  S.bank += (clamp(-P.vx * 0.012, -0.14, 0.14) - S.bank) * (1 - Math.exp(-dt * 6));
  camera.rotateZ(S.bank);
  const fov = baseFov + (S.speed - 24) * 0.22;
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  tu.uCam.value.copy(camera.position);

  bloom.strength = 0.85 + S.pulse * 0.2 + S.shock * 0.5;
  lensPass.uniforms.uTime.value = t;
  lensPass.uniforms.uShock.value = S.shock;
  lensPass.uniforms.uSpeed.value = clamp((S.speed - 24) / 38, 0, 1);
  if (audio.engine) audio.engine.f.frequency.setTargetAtTime(220 + S.speed * 14, audio.ctx.currentTime, 0.2);

  if (playing) updateHud();
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt, clock.elapsedTime);
  composer.render();
}

try {
  goMenu();
  frame();
  window.__booted = true;
  clearTimeout(window.__bootTimer);
  const reveal = () => $('loading').classList.add('done');
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(reveal, 300));
  setTimeout(reveal, 2500);
} catch (err) {
  console.error(err);
  if (window.__bootFail) window.__bootFail(err);
}
</script>
