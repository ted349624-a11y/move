<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#010207">
<meta name="description" content="Chroma Ring - an endless 3D rhythm game. Match every orb to its color and climb the global leaderboard.">
<title>Chroma Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#ff2d55;--cyan:#00d4ff;--lime:#3dff8a;--amber:#ffb020;
  --glass:rgba(10,14,30,.58);--line:rgba(255,255,255,.12);
  --text:#eaf2ff;--muted:#8d9bbd;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#010207;color:var(--text);
  font-family:'Rajdhani',system-ui,sans-serif;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse at center,rgba(255,30,60,0) 25%,rgba(255,25,55,.55) 100%)}
#touch{position:fixed;inset:0;z-index:4;display:none;touch-action:none}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:6;pointer-events:none;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
.hud-left .label{font-family:Orbitron;font-size:10px;letter-spacing:.3em;color:var(--muted)}
.hud-left .val{font-family:Orbitron;font-weight:700;font-size:20px;letter-spacing:.06em}
.hud-center{text-align:center}
#score{font-family:Orbitron;font-weight:900;font-size:clamp(46px,12vw,76px);line-height:1;
  letter-spacing:.04em;text-shadow:0 0 28px rgba(120,200,255,.55),0 2px 0 rgba(0,0,0,.4);
  font-variant-numeric:tabular-nums;transition:transform .12s ease}
#score.bump{transform:scale(1.12)}
.combo{margin-top:4px;height:24px;font-family:Orbitron;font-size:13px;letter-spacing:.25em;color:var(--muted)}
.combo b{color:#fff;font-weight:700}
.mult{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-weight:900;letter-spacing:.1em;
  color:#06101e;background:linear-gradient(90deg,var(--amber),var(--crimson));box-shadow:0 0 18px rgba(255,120,60,.6)}
.hud-right{display:flex;justify-content:flex-end;gap:10px}
.icon-btn{pointer-events:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:rgba(12,18,36,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .12s}
.icon-btn:hover{background:rgba(40,56,96,.6)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:#dfe9ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  font-family:Orbitron;font-weight:900;font-size:clamp(20px,6vw,34px);letter-spacing:.22em;white-space:nowrap;
  opacity:0;text-shadow:0 0 26px currentColor}
#banner.show{animation:banner 1.4s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.7);letter-spacing:.6em}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

#hint{position:fixed;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom));z-index:5;pointer-events:none;
  display:flex;justify-content:space-between;padding:0 7vw;font-family:Orbitron;font-size:12px;
  letter-spacing:.28em;color:rgba(234,242,255,.75);animation:hint 3.6s ease forwards}
#hint .sep{color:var(--muted)}
#hintMid{white-space:nowrap;letter-spacing:.2em}
@keyframes hint{0%,70%{opacity:1}100%{opacity:0}}
#grip{position:fixed;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
  pointer-events:none;z-index:5;opacity:0;transform:translate3d(-200px,-200px,0);transition:opacity .25s ease;
  background:radial-gradient(circle,rgba(210,236,255,.42) 0%,rgba(140,200,255,.14) 38%,rgba(140,200,255,0) 70%);
  box-shadow:inset 0 0 0 1.5px rgba(210,236,255,.35),0 0 30px rgba(120,190,255,.25)}
#grip.on{opacity:1}

#pops{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:Orbitron;font-weight:900;font-size:24px;
  text-shadow:0 0 14px currentColor,0 0 2px #fff;animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}
  15%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--glass);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--line);border-radius:26px;padding:30px 26px;text-align:center;position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08)}
.panel::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--crimson),var(--amber),var(--lime),var(--cyan));opacity:.55;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.kicker{font-family:Orbitron;font-size:11px;letter-spacing:.42em;color:var(--muted);margin-bottom:10px}
.kicker.red{color:var(--crimson);text-shadow:0 0 14px rgba(255,45,85,.6)}
h2{font-family:Orbitron;font-weight:900;font-size:26px;letter-spacing:.16em}

.menu{flex-direction:column;justify-content:space-between;text-align:center;background:
  linear-gradient(180deg,rgba(1,2,7,.55) 0%,rgba(1,2,7,0) 28%,rgba(1,2,7,0) 62%,rgba(1,2,7,.75) 100%)}
.logo{font-family:Orbitron;font-weight:900;font-size:clamp(42px,11vw,86px);letter-spacing:.1em;line-height:.95;
  background:linear-gradient(90deg,var(--crimson),var(--amber) 35%,var(--lime) 65%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(0,212,255,.35)) drop-shadow(0 0 40px rgba(255,45,85,.2))}
.tag{margin-top:12px;font-size:17px;font-weight:600;letter-spacing:.06em;color:rgba(234,242,255,.78)}
.menu-bottom{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.best-chip{align-self:center;font-family:Orbitron;font-size:11px;letter-spacing:.3em;color:var(--muted);
  padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(10,14,30,.45);backdrop-filter:blur(10px)}
.best-chip b{color:#fff;margin-left:6px}
.controls{font-size:14px;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.controls kbd{font-family:Orbitron;font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;color:#dfe9ff;margin:0 2px}

.btn{font-family:Orbitron;font-weight:700;letter-spacing:.2em;font-size:14px;color:#fff;padding:17px 24px;
  border-radius:15px;border:1px solid rgba(255,255,255,.16);cursor:pointer;width:100%;
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .12s,box-shadow .25s,border-color .25s,opacity .2s}
.btn:hover{border-color:rgba(255,255,255,.35)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{border:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);
  background:linear-gradient(120deg,#00b8ff,#6a5cff 50%,#ff2d70);
  box-shadow:0 12px 40px rgba(0,170,255,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:hover{box-shadow:0 14px 50px rgba(120,100,255,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{padding:15px 8px;letter-spacing:.12em;font-size:12px;white-space:nowrap}

.final{font-family:Orbitron;font-weight:900;font-size:clamp(64px,18vw,96px);line-height:1;margin:4px 0 8px;
  background:linear-gradient(180deg,#fff,#9fc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(120,190,255,.45))}
.sub{font-family:Orbitron;font-size:11px;letter-spacing:.22em;color:var(--muted);margin-bottom:22px}
.sub b{color:#fff}
.new-best{display:inline-block;margin-right:8px;padding:3px 9px;border-radius:999px;color:#06101e;font-weight:900;
  background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 18px rgba(61,255,138,.5)}
form{display:flex;flex-direction:column;gap:10px}
input{width:100%;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);
  font-size:18px;font-weight:600;letter-spacing:.06em;text-align:center;outline:none;user-select:text;-webkit-user-select:text;
  transition:border-color .2s,box-shadow .2s}
input:focus{border-color:rgba(0,212,255,.6);box-shadow:0 0 0 4px rgba(0,212,255,.12)}
.status{min-height:22px;margin-top:10px;font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.status.ok{color:var(--lime)}
.status.err{color:#ff6b86}

.board-panel{text-align:left;padding:24px 18px 18px;display:flex;flex-direction:column;max-height:min(720px,100%)}
.board-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px 16px}
.board-head .kicker{margin-bottom:4px}
.board-list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.entry{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);font-size:18px;font-weight:600}
.entry .rk{font-family:Orbitron;font-weight:900;font-size:14px;color:var(--muted);text-align:center}
.entry .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .sc{font-family:Orbitron;font-weight:700;font-variant-numeric:tabular-nums}
.entry.r1{background:linear-gradient(90deg,rgba(255,196,0,.18),rgba(255,196,0,.03));border-color:rgba(255,196,0,.3)}
.entry.r1 .rk{color:#ffd24a;text-shadow:0 0 12px rgba(255,200,0,.7)}
.entry.r2{background:linear-gradient(90deg,rgba(200,220,255,.14),rgba(200,220,255,.02));border-color:rgba(200,220,255,.25)}
.entry.r2 .rk{color:#dfe8ff}
.entry.r3{background:linear-gradient(90deg,rgba(255,140,80,.15),rgba(255,140,80,.02));border-color:rgba(255,140,80,.25)}
.entry.r3 .rk{color:#ffab7a}
.entry.me{box-shadow:inset 0 0 0 1px rgba(0,212,255,.65),0 0 22px rgba(0,212,255,.18)}
.entry.me .nm::after{content:'YOU';font-family:Orbitron;font-size:9px;letter-spacing:.2em;margin-left:8px;padding:2px 6px;
  border-radius:6px;background:rgba(0,212,255,.2);color:var(--cyan);vertical-align:middle}
.board-foot{padding:14px 8px 2px;font-size:14px;color:var(--muted);text-align:center;letter-spacing:.05em}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:16px}
.paused-panel{display:flex;flex-direction:column;gap:12px}
.paused-panel h2{margin-bottom:10px}

#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:#010207;font-family:Orbitron;font-size:12px;letter-spacing:.4em;color:var(--muted);transition:opacity .8s ease}
#loading.done{opacity:0;pointer-events:none}
.spinner{width:54px;height:54px;border-radius:50%;
  background:conic-gradient(var(--crimson),var(--amber),var(--lime),var(--cyan),var(--crimson));
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{max-width:320px;text-align:center;line-height:1.8;letter-spacing:.12em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="touch"></div>
<div id="grip"></div>
<div id="pops"></div>
<div id="banner"></div>

<div id="hud" class="hidden">
  <div class="hud-left"><div class="label">BEST</div><div class="val" id="hudBest">0</div></div>
  <div class="hud-center"><div id="score">0</div><div class="combo" id="combo"></div></div>
  <div class="hud-right">
    <button class="icon-btn" id="btnMute" aria-label="Toggle sound"></button>
    <button class="icon-btn" id="btnPause" aria-label="Pause">
      <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
    </button>
  </div>
</div>
<div id="hint" class="hidden"><span id="hintL"></span><span id="hintMid">&#8634; DRAG TO SPIN THE RING &#8635;</span><span id="hintR"></span></div>

<section id="menu" class="screen menu hidden">
  <div class="menu-top">
    <div class="kicker">AN ENDLESS RHYTHM GAME</div>
    <h1 class="logo">CHROMA<br>RING</h1>
    <p class="tag">Match every orb to its color. Never miss the beat.</p>
  </div>
  <div class="menu-bottom">
    <div class="best-chip">PERSONAL BEST <b id="menuBest">0</b></div>
    <button class="btn primary" id="btnPlay">PLAY</button>
    <button class="btn" id="btnBoard">LEADERBOARD</button>
    <div class="controls" id="controlsText">Drag around the ring to spin it. Quick flicks work too.</div>
  </div>
</section>

<section id="over" class="screen hidden">
  <div class="panel">
    <div class="kicker red">SIGNAL LOST</div>
    <div class="final" id="finalScore">0</div>
    <div class="sub"><span class="new-best hidden" id="newBest">NEW BEST</span>BEST <b id="overBest">0</b> &nbsp;·&nbsp; MAX COMBO <b id="overCombo">0</b></div>
    <form id="submitForm" autocomplete="off">
      <input id="name" maxlength="16" placeholder="Enter your name" spellcheck="false" autocapitalize="off" aria-label="Player name">
      <button class="btn primary" id="btnSubmit" type="submit">SUBMIT SCORE</button>
    </form>
    <div class="status" id="submitStatus"></div>
    <div class="row">
      <button class="btn" id="btnAgain">PLAY AGAIN</button>
      <button class="btn" id="btnBoard2">RANKINGS</button>
    </div>
  </div>
</section>

<section id="board" class="screen hidden">
  <div class="panel board-panel">
    <div class="board-head">
      <div><div class="kicker">GLOBAL</div><h2>LEADERBOARD</h2></div>
      <button class="icon-btn" id="btnCloseBoard" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="board-list" id="boardList"></div>
    <div class="board-foot" id="boardFoot"></div>
  </div>
</section>

<section id="paused" class="screen hidden">
  <div class="panel paused-panel">
    <h2>PAUSED</h2>
    <button class="btn primary" id="btnResume">RESUME</button>
    <button class="btn" id="btnQuit">QUIT TO MENU</button>
  </div>
</section>

<div id="loading"><div class="spinner"></div><div>INITIALIZING</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   Utilities
   ========================================================= */
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const mod4 = (n) => ((n % 4) + 4) % 4;
const rand = Math.random;
const vibrate = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

const COLOR_HEX = [0xff2d55, 0x00d4ff, 0x3dff8a, 0xffb020];
const COLOR_CSS = ['#ff2d55', '#00d4ff', '#3dff8a', '#ffb020'];
const COLS = COLOR_HEX.map((h) => new THREE.Color(h));
const WHITE = new THREE.Color(1, 1, 1);
const RED = new THREE.Color(1, 0.12, 0.2);
const CORE_IDLE = new THREE.Color(0.75, 0.88, 1);
const ORIGIN = new THREE.Vector3();

const R = 4, TUBE = 0.42, BALL_R = 0.38;
const HALF_PI = Math.PI / 2;
const BASE_EMI = 0.32;
// Lane directions: 0 top, 1 left, 2 bottom, 3 right (counter-clockwise).
const DIRS = [0, 1, 2, 3].map((k) => new THREE.Vector3(
  Math.round(Math.cos(HALF_PI + k * HALF_PI)), Math.round(Math.sin(HALF_PI + k * HALF_PI)), 0));

const isTouch = matchMedia('(pointer: coarse)').matches;
const PR = Math.min(window.devicePixelRatio || 1, isTouch ? 1.75 : 2);

/* =========================================================
   Renderer & scene
   ========================================================= */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('loading').innerHTML = '<p>WebGL is not available on this device or browser. Please try a recent version of Chrome, Safari or Firefox.</p>';
  throw e;
}
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010207);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(-6, 10, 12);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x6a7dff, 30, 40, 2);
rimLight.position.set(8, -7, 6);
scene.add(rimLight);
const coreLight = new THREE.PointLight(0xbfdfff, 20, 16, 2);
coreLight.position.set(0, 0, 1.4);
scene.add(coreLight);

function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.18, 'rgba(255,255,255,0.6)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.14)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = makeGlowTexture();

/* =========================================================
   Deep-space backdrop: procedural nebula baked once + stars
   ========================================================= */
const NEBULA_FS = `
precision highp float;
uniform float uSeed;
varying vec2 vUv;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), u.x), mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 7; i++) { v += a*noise(p); p = m*p; a *= 0.5; }
  return v;
}
void main(){
  vec2 p = (vUv - 0.5) * 6.0 + uSeed;
  vec2 q = vec2(fbm(p), fbm(p + vec2(5.2, 1.3)));
  vec2 r = vec2(fbm(p + 3.5*q + vec2(1.7, 9.2)), fbm(p + 3.5*q + vec2(8.3, 2.8)));
  float f = fbm(p + 3.0*r);
  vec3 deep   = vec3(0.003, 0.005, 0.022);
  vec3 violet = vec3(0.11, 0.018, 0.17);
  vec3 teal   = vec3(0.0, 0.075, 0.11);

const MAXP = isTouch ? 3000 : 5000;
const pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3);
const pSize = new Float32Array(MAXP), pAlpha = new Float32Array(MAXP);
const pVel = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP), pMax = new Float32Array(MAXP);
const pSize0 = new Float32Array(MAXP), pDrag = new Float32Array(MAXP);

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('pcolor', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('psize', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('palpha', new THREE.BufferAttribute(pAlpha, 1).setUsage(THREE.DynamicDrawUsage));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uPR: { value: PR } },
  vertexShader: `
    attribute vec3 pcolor; attribute float psize; attribute float palpha;
    uniform float uPR; varying vec3 vC; varying float vA;
    void main(){
      vC = pcolor; vA = palpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = psize * uPR * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vC; varying float vA;
    void main(){
      float r = length(gl_PointCoord - 0.5);
      if (r > 0.5) discard;
      float a = pow(1.0 - r*2.0, 1.8);
      gl_FragColor = vec4(vC * (1.2 + 2.6*a*a), a * vA);

  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});

function emit(x, y, z, vx, vy, vz, c, size, life, drag) {
  const i = pHead;
  pHead = (pHead + 1) % MAXP;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
  pSize0[i] = size; pSize[i] = size; pLife[i] = life; pMax[i] = life; pDrag[i] = drag; pAlpha[i] = 1;
}

function burst(pos, color, n, speed, size, life, bias, biasAmt = 0) {
  for (let i = 0; i < n; i++) {
    const a = rand() * Math.PI * 2;
    const z = rand() * 2 - 1;
    const rr = Math.sqrt(1 - z * z);
    const s = speed * (0.25 + rand() * 0.95);
    let vx = Math.cos(a) * rr * s, vy = Math.sin(a) * rr * s, vz = z * s * 0.6;
    if (bias) { vx += bias.x * biasAmt * rand(); vy += bias.y * biasAmt * rand(); }
    const c = rand() < 0.22 ? WHITE : color;
    emit(pos.x, pos.y, pos.z, vx, vy, vz, c, size * (0.4 + rand()), life * (0.45 + rand() * 0.8), 2.4);
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    if (pLife[i] <= 0) { pAlpha[i] = 0; pSize[i] = 0; continue; }
    const k = pLife[i] / pMax[i];
    const damp = Math.exp(-pDrag[i] * dt);
    const j = i * 3;
    pVel[j] *= damp; pVel[j + 1] *= damp; pVel[j + 2] *= damp;
    pPos[j] += pVel[j] * dt; pPos[j + 1] += pVel[j + 1] * dt; pPos[j + 2] += pVel[j + 2] * dt;
    pAlpha[i] = k * k;
    pSize[i] = pSize0[i] * (0.35 + 0.65 * k);
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.psize.needsUpdate = true;
  pGeo.attributes.palpha.needsUpdate = true;
  pGeo.attributes.pcolor.needsUpdate = true;
}

function addWave(pos, color, s0, s1, life, opacity) {

}
function updateWaves(dt) {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.t += dt;
    const k = Math.min(1, w.t / w.life);
    const e = 1 - Math.pow(1 - k, 3);
    w.mesh.scale.setScalar(w.s0 + (w.s1 - w.s0) * e);
    w.mesh.material.opacity = w.o * (1 - k) * (1 - k);
    if (k >= 1) { scene.remove(w.mesh); w.mesh.material.dispose(); waves.splice(i, 1); }
  }
}

const composer = new EffectComposer(renderer);

  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uShock: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uShock; varying vec2 vUv;
    float rnd(vec2 co){ return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float d = length(c);
      vec2 off = c * (0.0022 + uShock*0.02) * (0.4 + d*2.2);
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      float g = rnd(vUv*vec2(1733.0, 977.0) + fract(uTime)*91.0) - 0.5;
      col += g * 0.018;
      col *= 1.0 - d*d*0.85;
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
});
composer.addPass(lensPass);
composer.addPass(new OutputPass());

  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

  halfH = baseDist * t;
  halfW = halfH * camera.aspect;

/* =========================================================
   Audio (synthesised, no files)
   ========================================================= */
const audio = { ctx: null, master: null, rev: null, noise: null, drone: null };
let muted = store.get('cr_muted') === '1';

function initAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.6;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    const conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 2.4);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (rand() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    conv.buffer = ir;
    const rev = ctx.createGain();
    rev.gain.value = 0.3;
    rev.connect(conv); conv.connect(master);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = rand() * 2 - 1;
    Object.assign(audio, { ctx, master, rev, noise: nb });
  } catch {}
}
function route(node, wet) {
  node.connect(audio.master);
  if (wet > 0) { const g = audio.ctx.createGain(); g.gain.value = wet; node.connect(g); g.connect(audio.rev); }
}
function tone(freq, dur, type, vol, wet = 0.5, glide = 0) {
  const ctx = audio.ctx; if (!ctx) return;
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * glide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); route(g, wet);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, type, freq, q, vol, sweepTo = 0, wet = 0.3) {
  const ctx = audio.ctx; if (!ctx) return;
  const t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = audio.noise;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); route(g, wet);
  src.start(t, rand() * 0.5); src.stop(t + dur + 0.05);
}
const SCALE = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
const sfx = {
  hit(combo) {
    const n = SCALE[(combo - 1) % SCALE.length];
    const f = 330 * Math.pow(2, n / 12);
    tone(f, 0.6, 'sine', 0.26, 0.6);
    tone(f * 2, 0.32, 'triangle', 0.07, 0.6);
    tone(f * 3.01, 0.16, 'sine', 0.035, 0.4);
    noise(0.05, 'highpass', 5000, 0.8, 0.07, 0, 0.1);
  },
  turn() { noise(0.13, 'bandpass', 700, 1.4, 0.13, 3000, 0.12); },
  miss() {
    tone(200, 1.0, 'sawtooth', 0.22, 0.4, 0.15);
    tone(80, 1.4, 'sine', 0.45, 0.3, 0.4);
    noise(1.0, 'lowpass', 1600, 0.7, 0.5, 90, 0.6);
  },
  start() { [0, 7, 12, 19].forEach((n, i) => setTimeout(() => tone(262 * Math.pow(2, n / 12), 0.5, 'triangle', 0.1, 0.7), i * 75)); },
  level() { [12, 16, 19, 24].forEach((n, i) => setTimeout(() => tone(262 * Math.pow(2, n / 12), 0.35, 'sine', 0.08, 0.7), i * 55)); },
  click() { tone(1400, 0.05, 'square', 0.025, 0.05); },
};
function droneStart() {
  if (!audio.ctx || audio.drone) return;
  const ctx = audio.ctx;
  const g = ctx.createGain(); g.gain.value = 0;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200; f.Q.value = 5;
  const os = [55, 55.35, 82.4].map((fr) => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); return o; });
  f.connect(g); route(g, 0.5);
  g.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 2);
  audio.drone = { g, f, os };
}
function droneStop() {
  const d = audio.drone; if (!d) return;
  const t = audio.ctx.currentTime;

const S = {

  best: Number(store.get('cr_best')) || 0,
  rot: 0, visRot: 0,

  coreColor: CORE_IDLE.clone(),

const balls = [];
const segFlash = [0, 0, 0, 0];

const multiplier = () => Math.min(5, 1 + Math.floor(S.combo / 10));
const travelTime = () => Math.max(0.9, 2.45 - S.hits * 0.026);
const spawnGap = () => Math.max(0.36, 0.7 - S.hits * 0.005);

function spawnBall(demo) {
  const dir = (rand() * 4) | 0;
  const color = (rand() * 4) | 0;
  const travel = demo ? 1.9 : travelTime();
  const gap = demo ? 1.05 : spawnGap();
  let arrive = S.gameTime + travel;
  if (arrive < S.lastArrive + gap) arrive = S.lastArrive + gap;
  S.lastArrive = arrive;
  const edge = (dir % 2 === 0 ? halfH : halfW) + 1.6;
  const start = DIRS[dir].clone().multiplyScalar(edge);
  const end = DIRS[dir].clone().multiplyScalar(R + TUBE + BALL_R * 0.85);
  const mesh = makeBall(color);
  mesh.position.copy(start);
  mesh.scale.setScalar(0.001);
  balls.push({ mesh, dir, color, start, end, t0: S.gameTime, t1: arrive, demo, targeted: false });

function clearBalls(withFx) {

function toScreen(v) {

function hitFx(b, strong) {

  addWave(b.end, c, 0.2, 2.6, 0.5, 0.9);

function onHit(b) {
  S.hits++;
  S.combo++;

  S.score += m;

function onMiss(b, seg) {

function resolveBall(b) {

function rotate(d) {

/* =========================================================
   Input: grab the ring and drag it around (touch or mouse).
   Keyboard stays available on desktop.
   ========================================================= */
const QUARTER_PX = 95;  // finger travel along the ring for one quarter turn
const FLICK_QPS = 3;    // speed (quarter turns per second) that counts as a flick
const drag = { active: false, id: null, angle: 0, lastX: 0, lastY: 0, hist: [] };
const touchLayer = $('touch'), grip = $('grip');
const _center = new THREE.Vector3();

function ringCenterPx() {
  _center.set(0, 0, 0).project(camera);
  return { x: (_center.x * 0.5 + 0.5) * innerWidth, y: (-_center.y * 0.5 + 0.5) * innerHeight };
}
function moveGrip(x, y) { grip.style.transform = `translate3d(${x}px, ${y}px, 0)`; }
function detent() { sfx.turn(); vibrate(7); }

touchLayer.addEventListener('pointerdown', (e) => {
  e.preventDefault();

  Object.assign(drag, { active: true, id: e.pointerId, angle: S.rot * HALF_PI, lastX: e.clientX, lastY: e.clientY });
  drag.hist = [{ t: e.timeStamp, a: drag.angle }];

  grip.classList.add('on');

touchLayer.addEventListener('pointermove', (e) => {
  if (!drag.active || e.pointerId !== drag.id) return;
  e.preventDefault();

  const rx = e.clientX - c.x, ry = e.clientY - c.y;
  const r = Math.hypot(rx, ry);
  const dx = e.clientX - drag.lastX, dy = e.clientY - drag.lastY;
  // Only movement around the ring turns it. Screen y points down, so a positive value is clockwise.
  const tangential = r > 16 ? (rx * dy - ry * dx) / r : 0;
  const dAngle = (-tangential / QUARTER_PX) * HALF_PI;
  drag.angle += dAngle;
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  // Keep ~100 ms of samples (event timestamps, so main-thread lag can't skew the speed).
  const h = drag.hist;
  h.push({ t: e.timeStamp, a: drag.angle });
  while (h.length > 2 && e.timeStamp - h[1].t > 100) h.shift();
  moveGrip(e.clientX, e.clientY);
  // Notched like a real dial: it clicks into the next quarter just past halfway.
  const q = drag.angle / HALF_PI;
  let stepped = false;
  while (q > S.rot + 0.55) { S.rot++; stepped = true; }
  while (q < S.rot - 0.55) { S.rot--; stepped = true; }
  if (stepped) detent();
});

// mode: 'release' (finger lifted), 'cancel' (browser took over), 'abort' (game paused or ended)
function endDrag(e, mode) {
  if (!drag.active || (e && e.pointerId !== drag.id)) return;
  drag.active = false;
  try { touchLayer.releasePointerCapture(drag.id); } catch {}
  drag.id = null;
  grip.classList.remove('on');
  if (mode === 'abort' || S.state !== 'playing') return;
  const q = drag.angle / HALF_PI;
  let target = Math.round(q);
  // A quick flick turns a quarter in its direction even when it was short.
  if (mode === 'release') {
    const h = drag.hist, ref = h[0], last = h[h.length - 1];
    const tUp = e ? e.timeStamp : performance.now();
    const still = tUp - last.t > 80;  // finger stopped before lifting
    const span = (tUp - ref.t) / 1000;
    const vq = still || span <= 0 ? 0 : (drag.angle - ref.a) / HALF_PI / span;
    if (Math.abs(vq) > FLICK_QPS) target = vq > 0 ? Math.ceil(q - 0.15) : Math.floor(q + 0.15);
  }

}
touchLayer.addEventListener('pointerup', (e) => endDrag(e, 'release'));
touchLayer.addEventListener('pointercancel', (e) => endDrag(e, 'cancel'));
touchLayer.addEventListener('lostpointercapture', (e) => endDrag(e, 'cancel'));

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;

    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); if (!e.repeat) rotate(1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); if (!e.repeat) rotate(-1); }

/* =========================================================
   Main loop
   ========================================================= */
const clock = new THREE.Clock();
const nearest = [null, null, null, null];

function update(dt, t) {
  const live = !(S.state === 'playing' && S.paused);
  const gdt = live ? dt * S.timeScale : 0;

  if (S.state === 'dying') {
    S.dyingT += dt;
    S.timeScale = Math.min(1, S.timeScale + dt * 0.5);
    if (S.dyingT > 1.5) showOver();
  }

  if (live) {
    S.gameTime += gdt;
    const demo = S.state === 'menu' || S.state === 'over';
    if (S.state === 'playing' || demo) {
      while (S.gameTime >= S.nextSpawn) {
        spawnBall(demo);
        S.nextSpawn += demo ? 1.15 : spawnInterval();
      }
    }
    // Attract mode: the ring plays itself behind the menus.
    if (demo) {
      for (const b of balls) {
        if (b.demo && !b.targeted && b.t1 - S.gameTime < 0.5) {
          b.targeted = true;
          const target = mod4(b.dir - b.color);
          let d = mod4(target - S.rot);
          if (d === 3) d = -1; else if (d === 2) d = rand() < 0.5 ? 2 : -2;
          S.rot += d;
        }
      }
    }
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      const k = THREE.MathUtils.clamp((S.gameTime - b.t0) / (b.t1 - b.t0), 0, 1);
      b.mesh.position.lerpVectors(b.start, b.end, k);
      b.mesh.scale.setScalar(Math.min(1, k * 7 + 0.001));
      b.mesh.children[0].scale.setScalar(0.9 + 0.15 * Math.sin(t * 18 + i));
      if (rand() < 0.85) {
        const p = b.mesh.position, dv = DIRS[b.dir];
        emit(p.x + (rand() - 0.5) * 0.2, p.y + (rand() - 0.5) * 0.2, p.z + (rand() - 0.5) * 0.2,
          dv.x * 0.6 + (rand() - 0.5) * 0.5, dv.y * 0.6 + (rand() - 0.5) * 0.5, (rand() - 0.5) * 0.3,
          COLS[b.color], 0.35 + rand() * 0.3, 0.3 + rand() * 0.25, 3);
      }
      if (S.gameTime >= b.t1) { balls.splice(i, 1); resolveBall(b); }
    }
  }

  updateParticles(gdt);
  updateWaves(gdt);
  if (S.state === 'playing' && audio.drone) audio.drone.f.frequency.setTargetAtTime(Math.min(1500, 200 + S.hits * 9), audio.ctx.currentTime, 0.3);

  // Ring rotation: follows the finger while dragging (pulled slightly into its notch), then settles.
  let rotTarget = S.rot * HALF_PI;
  if (drag.active) rotTarget = drag.angle + (rotTarget - drag.angle) * 0.25;
  S.visRot += (rotTarget - S.visRot) * (1 - Math.exp(-dt * (drag.active ? 32 : 20)));
  ringGroup.rotation.z = S.visRot;

  // Ring lighting
  const dimTarget = S.state === 'dying' ? 0.22 : 1;
  S.dim += (dimTarget - S.dim) * (1 - Math.exp(-dt * 4));
  const breathe = 0.04 * Math.sin(t * 2.2);
  for (let i = 0; i < 4; i++) {
    segFlash[i] *= Math.exp(-dt * 5);
    segMats[i].emissiveIntensity = (BASE_EMI + breathe) * S.dim + segFlash[i] * 2.6;
    stripMats[i].color.copy(COLS[i]).multiplyScalar((2.4 + segFlash[i] * 5) * S.dim);
  }

  // Core
  S.coreFlash *= Math.exp(-dt * 3.2);
  const cf = Math.min(1, S.coreFlash * 1.4);
  const beat = 0.5 + 0.5 * Math.sin(t * 3);
  const coreCol = CORE_IDLE.clone().lerp(S.coreColor, cf);
  coreOrbMat.color.copy(coreCol).multiplyScalar((1.4 + S.coreFlash * 3.5 + beat * 0.3) * (0.4 + 0.6 * S.dim));
  coreGlowMat.color.copy(coreCol);
  coreGlowMat.opacity = (0.22 + S.coreFlash * 0.45) * (0.5 + 0.5 * S.dim);
  coreGlow.scale.setScalar(3.2 + S.coreFlash * 2.2 + beat * 0.25);
  coreLight.color.copy(coreCol);
  coreLight.intensity = (8 + S.coreFlash * 60) * S.dim;

  gyroB.rotation.y -= dt * 0.55; gyroB.rotation.z += dt * 0.3; gyroB.rotation.x = 1.1;

  // Lane receptors
  nearest.fill(null);
  for (const b of balls) if (!nearest[b.dir] || b.t1 < nearest[b.dir].t1) nearest[b.dir] = b;
  for (let d = 0; d < 4; d++) {
    const m = markers[d], b = nearest[d];
    if (b) {
      const k = THREE.MathUtils.clamp((S.gameTime - b.t0) / (b.t1 - b.t0), 0, 1);
      m.material.color.copy(COLS[b.color]).multiplyScalar(1.6);
      m.material.opacity = 0.2 + 0.8 * k * k;
      m.scale.setScalar(0.8 + k * 0.9);
    } else {
      m.material.color.setRGB(1, 1, 1);
      m.material.opacity = 0.1;
      m.scale.setScalar(0.7);
    }
  }

  // Backdrop
  S.nebPulse *= Math.exp(-dt * 2);
  nebula.rotation.z += dt * 0.004;
  nebulaMat.color.setScalar(1 + S.nebPulse * 0.45);
  stars.rotation.z += dt * 0.002;
  starMat.uniforms.uTime.value = t;

  // Camera
  S.shake *= Math.exp(-dt * 5);
  S.shock *= Math.exp(-dt * 2.2);
  const idle = S.state === 'playing' ? 0.25 : 1;
  const sx = Math.sin(t * 0.21) * 0.7 * idle + (rand() - 0.5) * S.shake;
  const sy = Math.cos(t * 0.17) * 0.5 * idle + (rand() - 0.5) * S.shake;
  camera.position.set(sx, -baseDist * CAM_TILT + sy, baseDist);
  camera.lookAt(0, 0, 0);

  bloom.strength = 0.75 + S.coreFlash * 0.25 + S.shock * 0.5;
  lensPass.uniforms.uTime.value = t;
  lensPass.uniforms.uShock.value = S.shock;
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt, clock.elapsedTime);
  composer.render();
}

goMenu();
frame();
const reveal = () => $('loading').classList.add('done');
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(reveal, 250));
setTimeout(reveal, 2500);
</script>
