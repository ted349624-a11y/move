<!DOCTYPE html>
<html lang="en">

<style>
:root{--cyan:#00e5ff;--magenta:#ff2bd6;--violet:#7a5cff;--lime:#3dff8a;--red:#ff6b86;
  --glass:rgba(6,10,24,.62);--line:rgba(255,255,255,.12);--text:#eaf2ff;--muted:#93a1c4;
  --display:'Unbounded',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#010207;color:var(--text);font-family:var(--body);min-height:100%}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(1,2,7,.35) 0%,rgba(1,2,7,0) 22%,rgba(1,2,7,0) 48%,rgba(1,2,7,.75) 72%,rgba(1,2,7,.92) 100%)}
.wrap{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom));
  min-height:100vh;display:flex;flex-direction:column}
.hero{text-align:center}
.kicker{font-size:11px;font-weight:600;letter-spacing:.42em;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,58px);letter-spacing:.06em;line-height:1;margin-top:10px;color:#fff;white-space:nowrap;
  text-shadow:0 0 4px rgba(255,255,255,.9),0 0 14px rgba(0,229,255,.95),0 0 34px rgba(0,229,255,.7),0 0 70px rgba(122,92,255,.55),0 0 110px rgba(255,43,214,.45)}
.sub{margin-top:12px;font-size:15px;line-height:1.5;color:rgba(234,242,255,.86);text-shadow:0 1px 14px rgba(1,2,7,.9),0 0 4px rgba(1,2,7,.8)}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px;border-radius:999px;border:1px solid rgba(61,255,138,.35);
  background:rgba(4,10,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;font-weight:600;letter-spacing:.12em}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.spacer{flex:1 0 34vh}
.panel{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--line);border-radius:24px;padding:24px 20px 20px;text-align:center;position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08)}
.panel::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--cyan),var(--violet),var(--magenta));opacity:.65;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.panel h2{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.1em}
.tprog{height:4px;border-radius:4px;background:rgba(255,255,255,.1);margin:16px 0 10px;overflow:hidden}
.tbar{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 12px rgba(0,229,255,.6);transition:width .5s ease}
.tstep{font-size:11px;font-weight:600;letter-spacing:.3em;color:var(--muted)}
.deck{display:grid;grid-template-columns:minmax(0,1fr);margin-top:16px;padding-bottom:42px}
.card{grid-area:1/1;align-self:start;position:relative;padding:22px 18px 18px;border-radius:20px;text-align:center;
  background:linear-gradient(180deg,#151b36,#0a0e20);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);transform-origin:50% 100%;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s ease,filter .55s ease}
.card.enter{transform:translateY(-40px) scale(1.05);opacity:0}
.card.past{pointer-events:none;overflow:hidden}
.card.past > *{visibility:hidden}
.card-ico{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;
  background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.35);box-shadow:0 0 18px rgba(0,229,255,.2)}
.card-ico svg{width:24px;height:24px;fill:none;stroke:#bff6ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card-title{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.05em}
.card-text{margin:8px 0 16px;font-size:14px;line-height:1.55;color:#b9c4dd}
.card-text b{color:#fff;font-weight:600;word-break:break-all}
.btn{display:block;width:100%;position:relative;overflow:hidden;font-family:'Sora',var(--body);font-weight:600;letter-spacing:.12em;font-size:14px;color:#fff;
  padding:17px 22px;border-radius:999px;cursor:pointer;text-align:center;text-decoration:none;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .12s,box-shadow .25s,background .25s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{border:none;color:#07090f;background:#fff;box-shadow:0 10px 40px rgba(160,200,255,.35)}
.btn.primary::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(160,220,255,.7) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,62%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion: reduce){.btn.primary::after{display:none}}
.btn + .btn{margin-top:10px}
.field{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.38);padding:0 20px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:rgba(0,229,255,.7);box-shadow:0 0 0 4px rgba(0,229,255,.14)}
.field span{color:var(--muted);font-weight:600;font-size:17px}
.field input{flex:1;min-width:0;border:none;background:transparent;padding:15px 0;outline:none;font-size:16px;font-weight:500}
.card-err{min-height:18px;margin-top:8px;font-size:12px;color:var(--red)}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.foot a{color:#dff9ff}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#010207;transition:opacity .8s ease}
#loading.done{opacity:0;pointer-events:none}
.spinner{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--cyan),var(--violet),var(--magenta),var(--cyan));
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="shade"></div>

<main class="wrap">
  <header class="hero">
    <div class="kicker">LAYER RUN</div>
    <h1>WHITELIST</h1>
    <p class="sub">Complete a few quick steps on X and add your wallet to secure your spot.</p>
    <div class="chip hidden" id="joined"><i></i><span id="joinedText"></span></div>
  </header>
  <div class="spacer"></div>
  <section class="panel" aria-labelledby="stepsTitle">
    <h2 id="stepsTitle">JOIN THE LIST</h2>
    <div class="tprog"><div class="tbar" id="bar"></div></div>
    <div class="tstep" id="step"></div>
    <div class="deck" id="deck"></div>
  </section>
  <p class="foot">Want a head start? <a href="/">Play Layer Run</a>. The top 1,500 on the leaderboard also get WL.</p>
</main>

<div id="loading"><div class="spinner"></div></div>

<script type="module">
import * as THREE from '/vendor/three-r160.min.js';
import { EffectComposer, RenderPass, UnrealBloomPass, OutputPass } from '/vendor/three-r160.min.js';

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const isTouch = matchMedia('(pointer: coarse)').matches;
const vibrate = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

/* =========================================================
   Background: the core charging up and bursting, in real time
   ========================================================= */
function startScene() {
  const PR = Math.min(window.devicePixelRatio || 1, isTouch ? 1.6 : 2);
  const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(PR);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x010207, 1);
  const scene = new THREE.Scene();
  // soft studio reflections for the chrome rings
  {
    const room = new THREE.Scene();
    room.add(new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), new THREE.MeshBasicMaterial({ color: 0x05070d, side: THREE.BackSide })));
    const lamp = new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 3.2, 3.6) });
    [[0, 8, 0, Math.PI / 2, 0], [-9, 2, 2, 0, Math.PI / 2], [9, -1, 3, 0, -Math.PI / 2], [0, 0, -9, 0, 0]].forEach(([x, y, z, rx, ry]) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), lamp); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); room.add(m);
    });
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(room, 0.04).texture;
  }
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(-6, 10, 12); scene.add(key);
  const CORE = new THREE.Color(0.75, 0.88, 1), CYAN = new THREE.Color('#00e5ff'), MAG = new THREE.Color('#ff2bd6');
  const coreLight = new THREE.PointLight(CORE, 8, 16, 2); coreLight.position.set(0, 0, 1.4); scene.add(coreLight);
  const chrome = new THREE.MeshPhysicalMaterial({ color: 0xb8c2d4, metalness: 1, roughness: 0.22, clearcoat: 0.5, envMapIntensity: 0.38 });
  const gc = document.createElement('canvas'); gc.width = gc.height = 256; const g = gc.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.6)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.14)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const glowTex = new THREE.CanvasTexture(gc); glowTex.colorSpace = THREE.SRGBColorSpace;

  const orbMat = new THREE.MeshBasicMaterial({ color: CORE.clone() });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.42, 48, 36), orbMat));
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.88, 64, 48), new THREE.MeshPhysicalMaterial({ color: 0x9fb8ff, roughness: 0.04, clearcoat: 1, transparent: true, opacity: 0.2, envMapIntensity: 0.5, depthWrite: false }));
  shell.renderOrder = 2; scene.add(shell);
  const glowMat = new THREE.SpriteMaterial({ map: glowTex, color: CORE.clone(), transparent: true, opacity: 0.24, blending: THREE.AdditiveBlending, depthWrite: false });
  const glow = new THREE.Sprite(glowMat); scene.add(glow);
  const ringMat = chrome.clone(); ringMat.color.set(0x7a8394); ringMat.envMapIntensity = 0.22;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.12, 0.08, 24, 160), ringMat); scene.add(ring);
  const gA = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.022, 12, 200), chrome); scene.add(gA);
  const gB = new THREE.Mesh(new THREE.TorusGeometry(1.58, 0.018, 12, 200), chrome); scene.add(gB);

  const N = isTouch ? 500 : 700;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N), alpha = new Float32Array(N);
  const seed = Array.from({ length: N }, (_, i) => ({ a: Math.random() * 6.283, z: (Math.random() - 0.5) * 0.8, s: 0.6 + Math.random(), off: i / N, m: Math.random(), sp: 0.7 + Math.random() * 0.6 }));
  for (let i = 0; i < N; i++) { const c = seed[i].m < 0.5 ? CYAN : MAG; col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('pcolor', new THREE.BufferAttribute(col, 3));
  pg.setAttribute('psize', new THREE.BufferAttribute(size, 1).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('palpha', new THREE.BufferAttribute(alpha, 1).setUsage(THREE.DynamicDrawUsage));
  const pts = new THREE.Points(pg, new THREE.ShaderMaterial({
    uniforms: { uPR: { value: PR } },
    vertexShader: 'attribute vec3 pcolor; attribute float psize; attribute float palpha; uniform float uPR; varying vec3 vC; varying float vA; void main(){ vC=pcolor; vA=palpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=psize*uPR*(300.0/-mv.z); gl_Position=projectionMatrix*mv; }',
    fragmentShader: 'varying vec3 vC; varying float vA; void main(){ float r=length(gl_PointCoord-0.5); if(r>0.5) discard; float a=pow(1.0-r*2.0,1.8); gl_FragColor=vec4(vC*(1.2+2.6*a*a), a*vA); }',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.frustumCulled = false; scene.add(pts);
  const waveGeo = new THREE.RingGeometry(0.96, 1.0, 160);
  const waves = [CYAN, MAG].map((c) => { const m = new THREE.Mesh(waveGeo, new THREE.MeshBasicMaterial({ color: c.clone().multiplyScalar(2.4), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); m.position.z = 0.1; scene.add(m); return m; });

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.55, 0.88);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const D = 4.2 / Math.tan(THREE.MathUtils.degToRad(21));
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h); composer.setSize(w, h);
    camera.aspect = w / h;
    // keep the core and its rings in view on narrow phones, and sit it in the upper part of the screen
    const fit = Math.min(camera.aspect < 0.75 ? 0.75 / camera.aspect : 1, 1.7);
    const wide = camera.aspect >= 1;   // on wide screens: a little smaller and lower, clear of the heading
    camera.position.set(0, -0.35, D * fit * (wide ? 1.25 : 1));
    camera.lookAt(0, (wide ? -0.55 : -1.55) * fit, 0);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  const TAU = Math.PI * 2, B = 0.62, LOOP = 4;
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const tmp = new THREE.Color();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    requestAnimationFrame(frame);
    const u = reduce ? 0.3 : ((now / 1000) % LOOP) / LOOP;
    const charge = u < B ? sm(0, B, u) : 0;
    const after = u >= B ? 1 - sm(B, 1, u) : 0;
    const flash = u >= B ? Math.exp(-(u - B) * 28) : 0;
    const spin = TAU * 2 * u + 1.2 * Math.sin(TAU * u - 1.2);
    gA.rotation.set(0.65 + spin, 0.9 + spin * 0.5, 0);
    gB.rotation.set(1.1, 0.35 - spin, 0.3 + spin * 0.5);
    ring.rotation.set(0.25 * Math.sin(TAU * u) + 0.15 * charge * Math.sin(TAU * 8 * u), 0.12 * Math.sin(TAU * u + 1.3), 0);
    const s = 1 + 0.06 * charge - 0.05 * flash; ring.scale.setScalar(s); gA.scale.setScalar(s); gB.scale.setScalar(s);
    const tint = tmp.copy(CORE).lerp(CYAN, 0.35 * charge).lerp(MAG, 0.25 * after);
    orbMat.color.copy(tint).multiplyScalar(1.4 + 0.9 * charge + 1.6 * flash + 0.3 * after);
    glowMat.color.copy(tint); glowMat.opacity = 0.22 + 0.1 * charge + 0.22 * flash + 0.05 * after;
    glow.scale.setScalar(3.2 + 0.6 * charge + 1.6 * flash);
    coreLight.intensity = 7 + 8 * charge + 20 * flash;
    bloom.strength = 0.8 + 0.15 * charge + 0.35 * flash;
    waves.forEach((w, k) => { const p = Math.min(1, Math.max(0, (u - B - k * 0.05) / 0.32)); w.scale.setScalar(0.9 + p * (k ? 6.2 : 7.6)); w.material.opacity = p > 0 && p < 1 ? Math.pow(1 - p, 2) * 0.9 : 0; });
    const inEnv = u < B ? Math.sin(Math.PI * u / B) : 0;
    for (let i = 0; i < N; i++) {
      const q = seed[i], j = i * 3;
      let x = 0, y = 0, z = 0, a = 0, sz = 0;
      if (i % 2 === 0) {
        const p = ((u / B) * q.sp * 2 + q.off) % 1;
        const r = 0.75 + 5.2 * Math.pow(1 - p, 1.4), ang = q.a + 4.5 * p;
        x = Math.cos(ang) * r; y = Math.sin(ang) * r; z = q.z * (1 - p);
        a = Math.min(1, 1.4 * inEnv) * Math.sin(Math.PI * p); sz = 0.26 * q.s;
      } else if (u >= B) {
        const p = (u - B) / (1 - B), e = 1 - Math.pow(1 - p, 3);
        const r = 0.6 + (2.6 + 4.6 * q.s) * e, ang = q.a + 0.6 * e;
        x = Math.cos(ang) * r; y = Math.sin(ang) * r; z = q.z * 2 * e;
        a = Math.pow(1 - p, 1.6); sz = 0.24 * q.s * (1 - 0.5 * p);
      }
      pos[j] = x; pos[j + 1] = y; pos[j + 2] = z; size[i] = sz; alpha[i] = a;
    }
    pg.attributes.position.needsUpdate = true; pg.attributes.psize.needsUpdate = true; pg.attributes.palpha.needsUpdate = true;
    composer.render();
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   One-time X steps + wallet
   ========================================================= */
const X_HANDLE = 'LayerRun';
// Paste the whitelist post's ID here (the number at the end of x.com/LayerRun/status/...).
// Until it is set, the like, repost and reply steps open the @LayerRun profile.
const X_POST_ID = '';
const PROFILE = `https://x.com/${X_HANDLE}`;
const POST = X_POST_ID ? `https://x.com/${X_HANDLE}/status/${X_POST_ID}` : PROFILE;
const postLink = (intent) => (!X_POST_ID ? PROFILE : isTouch ? POST : `https://x.com/intent/${intent}`);
const POST_KEY = X_POST_ID || 'pinned';
const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICONS = {
  at: svg('<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>'),
  follow: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>'),
  heart: svg('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>'),
  repost: svg('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'),
  reply: svg('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>'),
  bell: svg('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  wallet: svg('<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.2"/>'),
  check: svg('<path d="M20 6L9 17l-5-5"/>'),
};
const TASKS = [
  { id: 'user', icon: ICONS.at, title: 'Your X username', text: 'Enter the X account you will use for the next steps.' },
  { id: 'follow', icon: ICONS.follow, title: `Follow @${X_HANDLE}`, text: `Follow @${X_HANDLE} on X to keep up with the launch.`,
    url: isTouch ? PROFILE : `https://x.com/intent/follow?screen_name=${X_HANDLE}` },
  { id: `like-${POST_KEY}`, icon: ICONS.heart, title: 'Like the post',
    text: X_POST_ID ? 'Open the post on X and tap the heart.' : `Open @${X_HANDLE} on X and like the pinned post.`, url: postLink(`like?tweet_id=${X_POST_ID}`) },
  { id: `repost-${POST_KEY}`, icon: ICONS.repost, title: 'Repost it', text: 'Repost the same post so your followers see it.', url: postLink(`retweet?tweet_id=${X_POST_ID}`) },
  { id: `reply-${POST_KEY}`, icon: ICONS.reply, title: 'Leave a reply',
    text: isTouch || !X_POST_ID ? 'Open the post, tap reply and write whatever you like, in your own words.' : 'Reply to the post. Write whatever you like, in your own words.',
    url: postLink(`tweet?in_reply_to=${X_POST_ID}`) },
  { id: 'notify', icon: ICONS.bell, title: 'Turn on notifications', text: `Open the @${X_HANDLE} profile and tap the bell so you never miss an update.`, url: PROFILE },
  { id: 'wallet', icon: ICONS.wallet, title: 'Your wallet', text: 'Paste the EVM wallet address (0x…) you want on the whitelist.' },
];
// Bump the key to make everyone start the steps over.
const KEY = 'lr_wl_v2';
try { localStorage.removeItem('lr_wl'); } catch {}
const W = (() => { try { return JSON.parse(store.get(KEY)) || {}; } catch { return {}; } })();
W.done = Array.isArray(W.done) ? W.done : [];
W.user = typeof W.user === 'string' ? W.user : '';
W.done = W.done.filter((id, i, a) => TASKS.some((t) => t.id === id) && a.indexOf(id) === i);
if (!W.user) W.done = W.done.filter((id) => id !== 'user');
const save = () => store.set(KEY, JSON.stringify(W));
const pending = () => TASKS.findIndex((t) => !W.done.includes(t.id));
const allDone = () => pending() === -1;

function addText(el, cls, text, tag = 'div') { const n = document.createElement(tag); n.className = cls; n.textContent = text; el.appendChild(n); return n; }
const short = (w) => (w.length > 14 ? w.slice(0, 6) + '…' + w.slice(-4) : w);
function cleanHandle(v) {
  return String(v || '').trim().replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i, '').replace(/^@/, '').replace(/[/?#].*$/, '');
}
function inputCard(card, prefix, placeholder, value, button, onSubmit) {
  const form = document.createElement('form');
  form.autocomplete = 'off';
  form.innerHTML = `<label class="field">${prefix ? '<span>' + prefix + '</span>' : ''}<input spellcheck="false" autocapitalize="off" autocorrect="off"></label><button class="btn primary" type="submit"></button>`;
  const input = form.querySelector('input');
  input.placeholder = placeholder; input.value = value; input.setAttribute('aria-label', placeholder);
  const btn = form.querySelector('button'); btn.textContent = button;
  const err = addText(card, 'card-err', '');
  form.addEventListener('submit', (e) => { e.preventDefault(); onSubmit(input.value, err, btn); });
  card.insertBefore(form, err);
}
function buildCard(i) {
  const card = document.createElement('div');
  card.className = 'card';
  if (i >= TASKS.length) {
    card.insertAdjacentHTML('beforeend', `<div class="card-ico">${ICONS.check}</div>`);
    addText(card, 'card-title', "YOU'RE ON THE LIST");
    const p = document.createElement('p'); p.className = 'card-text';
    p.append('Locked in for ');
    const u = document.createElement('b'); u.textContent = '@' + W.user; p.append(u);
    p.append(' with ');
    const w = document.createElement('b'); w.textContent = short(W.wallet || ''); p.append(w);
    p.append('. Keep notifications on so you catch the launch.');
    card.appendChild(p);
    const play = addText(card, 'btn primary', 'PLAY LAYER RUN', 'a'); play.href = '/';
    return card;
  }
  const t = TASKS[i];
  card.insertAdjacentHTML('beforeend', `<div class="card-ico">${t.icon}</div>`);
  addText(card, 'card-title', t.title);
  addText(card, 'card-text', t.text, 'p');
  if (t.id === 'user') {
    inputCard(card, '@', 'username', W.user, 'CONTINUE', (v, err) => {
      const h = cleanHandle(v);
      if (!/^[A-Za-z0-9_]{1,15}$/.test(h)) { err.textContent = 'Use your X handle: letters, numbers and _ (up to 15).'; return; }
      W.user = h; complete();
    });
  } else if (t.id === 'wallet') {
    inputCard(card, '', '0x… wallet address', W.wallet || '', 'JOIN THE WHITELIST', async (v, err, btn) => {
      const w = String(v || '').trim();
      if (!/^0x[a-fA-F0-9]{40}$/.test(w)) { err.textContent = 'Paste an EVM address: 0x followed by 40 characters.'; return; }
      err.textContent = ''; btn.disabled = true; btn.textContent = 'SAVING…';
      try {
        const r = await fetch('/api/wl', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: W.user, wallet: w }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Could not save. Try again.');
        W.wallet = w;
        if (d.count) showCount(d.count);
        complete();
      } catch (e2) { err.textContent = e2.message || 'Network error. Try again.'; btn.disabled = false; btn.textContent = 'JOIN THE WHITELIST'; }
    });
  } else {
    const open = addText(card, 'btn primary', 'OPEN ON X', 'a');
    open.href = t.url; open.target = '_blank'; open.rel = 'noopener noreferrer';
    const done = addText(card, 'btn', "I'VE DONE IT", 'button');
    done.type = 'button'; done.disabled = true;
    open.addEventListener('click', () => { setTimeout(() => { done.disabled = false; }, 1500); });
    done.addEventListener('click', complete);
  }
  return card;
}
function layout(animateTop) {
  const cards = [...$('deck').children], top = cards.length - 1;
  if (top >= 0) cards[top].style.height = '';
  const h = top >= 0 ? cards[top].offsetHeight : 0;
  cards.forEach((c, i) => {
    const d = top - i;
    c.style.height = d ? h + 'px' : '';
    c.classList.toggle('past', d > 0);
    c.style.zIndex = String(20 - d);
    c.style.transform = d ? `translateY(${d * 13}px) scale(${1 - d * 0.05})` : '';
    c.style.opacity = d > 3 ? '0' : '';
    c.style.filter = d ? 'brightness(.5)' : '';
  });
  if (animateTop && cards[top]) {
    const c = cards[top];
    c.classList.add('enter');
    requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('enter')));
  }
  $('bar').style.width = (W.done.length / TASKS.length) * 100 + '%';
  $('step').textContent = allDone() ? 'ALL STEPS DONE' : `STEP ${W.done.length + 1} OF ${TASKS.length}`;
}
function render() {
  const deck = $('deck');
  deck.innerHTML = '';
  TASKS.forEach((t, i) => { if (W.done.includes(t.id)) deck.appendChild(buildCard(i)); });
  deck.appendChild(buildCard(allDone() ? TASKS.length : pending()));
  layout(true);
}
function complete() {
  const cur = pending();
  if (cur < 0) return;
  W.done.push(TASKS[cur].id);
  save();
  $('deck').appendChild(buildCard(allDone() ? TASKS.length : pending()));
  layout(true);
  vibrate(12);
}
function showCount(n) {
  $('joinedText').textContent = Number(n).toLocaleString('en-US') + ' JOINED';
  $('joined').classList.remove('hidden');
}
fetch('/api/wl').then((r) => (r.ok ? r.json() : null)).then((d) => { if (d && d.count) showCount(d.count); }).catch(() => {});

render();
try { startScene(); } catch (e) { console.error(e); }
const reveal = () => $('loading').classList.add('done');
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(reveal, 200));
setTimeout(reveal, 2500);
</script>
<script>
// never leave people on the spinner if the 3D part cannot start
setTimeout(function () { var l = document.getElementById('loading'); if (l) l.classList.add('done'); }, 8000);
</script>
</body>
